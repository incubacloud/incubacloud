site_name: IncubaCloud Documentation
site_description: User documentation for the IncubaCloud platform — a PaaS for Odoo
site_url: https://docs.incubacloud.io/
site_author: IncubaCloud
copyright: Copyright &copy; IncubaCloud

# No repo_url: with a GitHub address the theme's script asks api.github.com for
# the repository's stars and forks from every visitor's browser, and it has no
# option to turn that off. The "edit this page" link is a full address, and the
# repository stays one click away in the footer (extra.social).
edit_uri: https://github.com/incubacloud/incubacloud/edit/19.0/docs/user/docs/

theme:
  name: material
  language: en
  font:
    text: Onest
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/incubacloud
    - icon: fontawesome/solid/globe
      link: https://www.incubacloud.io
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Downloads the fonts and any external file at build time and serves them
  # from this site: a visitor's browser never contacts Google.
  - privacy

nav:
  - Home: index.md
  - Get started:
    - getting-started/index.md
    - Create your account: getting-started/signup.md
    - Create your first project: getting-started/first-project.md
    - Deploy your first instance: getting-started/first-deploy.md
  - Projects: projects/index.md
  - Instances:
    - instances/index.md
    - Logs: instances/logs.md
  - Hosts:
    - hosts/index.md
    - Connect your own VPS: hosts/connect.md
    - Order a VPS: hosts/hire.md
  - Backups:
    - backups/index.md
    - Restore a backup: backups/restore.md
    - Restore to any minute: backups/any-minute.md
  - Billing: billing/index.md
  - Agents:
    - agents/index.md
    - Connect an agent: agents/connect.md
    - Approvals: agents/confirmations.md
    - Secrets: agents/secrets.md
    - Revoke an agent: agents/revoke.md
    - Limits: agents/limits.md
    - Troubleshooting: agents/troubleshooting.md
  - Assistant:
    - assistant/index.md
    - Settings: assistant/settings.md
    - Privacy and limits: assistant/privacy-and-limits.md
  - Migrations:
    - migrations/index.md
    - From Odoo.sh: migrations/from-odoosh.md
  - Reference:
    - reference/index.md
    - Notifications: reference/notifications.md
    - Monitoring: reference/monitoring.md
    - Monitoring panels: reference/monitoring-panels.md
    - Service limits: reference/limits.md

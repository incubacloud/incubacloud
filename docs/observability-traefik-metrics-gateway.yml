# /root/traefik/dynamic/metrics-gateway.yml on the central's host (Cloud1).
#
# Publishes the shared observability central for agents and browsers that
# do NOT live on this host (today: the tenants on Tenants1). A separate
# file: a bad edit here is rejected by Traefik and the rest keeps serving.
#
# Two backends on the Docker bridge (verified reachable from a container
# on this host, 2026-08-10): vmauth on :8428 (the account boundary for
# data) and Grafana on :3000 (the browser, which vmauth cannot proxy
# because of websockets). Priority beats the catchall, which sits at a
# negative priority so anything explicit outranks it.
#
# Certificate: none is asked for. `tls: {}` turns TLS on and leaves the
# certificate to the host's default store, which is where the panel
# installs the one it holds for the zone. Naming a resolver instead
# makes Traefik ignore that store and ask a certificate authority — and
# behind a CDN that challenge reaches the CDN and never the host, so it
# can never succeed. Worse, it keeps the obtained certificate alive in
# Traefik's own store, where it outranks the default one: this file
# pinned `*.incubacloud.io` and was, on its own, the reason Cloud 1 kept
# serving Let's Encrypt after every router had stopped asking for it.
#
# A host reached directly is the other case: there ACME works and is
# better, because a CDN's origin certificate is trusted by that CDN and
# by no browser. Use `certResolver: letsencrypt` there.
#
# Framing: Grafana is the one thing here meant to be put in a frame, and
# by panels on OTHER origins — the operator's at www, each tenant's at its
# own subdomain. So it carries its own `frame-ancestors`, and the host's
# `cloud.host.frame_ancestors` must stay EMPTY: that one is an entrypoint
# default, and an entrypoint header overrides every router's (measured on
# Traefik v2.11), so any list set there would replace this one. The panel
# keeps its strict `'self'` on its own routers, in `prod.yaml`. No
# `X-Frame-Options` here: it cannot name another origin, so it would block
# exactly the frames this exists to allow.
http:
  routers:
    # Operator-only paths must NOT be public. Their only consumers — the
    # panel and Grafana's datasource — reach vmauth over the bridge, never
    # through here. Higher priority so it wins over the data router below;
    # the ipWhitelist turns any outside request into 403.
    metrics-operator-denied:
      rule: 'Host(`metrics.incubacloud.io`) && (PathPrefix(`/admin-r/`) || PathPrefix(`/gadmin/`))'
      priority: 30
      entryPoints:
        - https
      service: metrics-vmauth
      middlewares:
        - metrics-deny-public
      tls: {}

    # Grafana in the browser: websockets (Grafana Live), and NO basic auth
    # in front — Grafana authenticates the person itself through OIDC.
    metrics-grafana:
      rule: 'Host(`metrics.incubacloud.io`) && PathPrefix(`/grafana/`)'
      priority: 20
      entryPoints:
        - https
      service: metrics-grafana
      middlewares:
        - metrics-grafana-frameguard
      tls: {}

    # The data plane (/w/ /r/ /lw/ /lr/). vmauth enforces the account
    # boundary and returns 401 to a credential-less request, so this is
    # safe to expose.
    metrics-data:
      rule: 'Host(`metrics.incubacloud.io`)'
      priority: 10
      entryPoints:
        - https
      service: metrics-vmauth
      tls: {}

  services:
    metrics-vmauth:
      loadBalancer:
        servers:
          - url: 'http://172.17.0.1:8428'
    metrics-grafana:
      loadBalancer:
        servers:
          - url: 'http://172.17.0.1:3000'

  middlewares:
    # Any name in the zone may frame Grafana: the operator's panel and
    # every tenant's, including one created tomorrow. Naming each tenant
    # instead would mean re-shipping this file on every sign-up, and a
    # tenant missed there gets blank charts and no error.
    #
    # The cost, stated: a tenant controls what its own site serves, so it
    # can frame Grafana too. Grafana's session cookie is SameSite=Lax and
    # every name here is the same site, so that frame is signed in as
    # whoever looks at it. Tenant users are Viewers and have nothing to
    # click; the operator is Editor on its own organisation's dashboards.
    # Listing tenants one by one would not remove this, since each tenant
    # would be on the list. The panel itself is not reachable this way:
    # it answers with its own 'self'.
    metrics-grafana-frameguard:
      headers:
        contentSecurityPolicy: "frame-ancestors 'self' https://*.incubacloud.io"

    metrics-deny-public:
      ipWhitelist:
        sourceRange:
          - '127.0.0.1/32'

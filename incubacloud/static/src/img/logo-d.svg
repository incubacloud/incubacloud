<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <!-- IncubaCloud — dark theme lockup. Stripes drawn as overlay rects in dark slate
       so the SVG rasterizes correctly. On a transparent SVG over an arbitrary dark bg,
       the stripes will look "solid" rather than "cut through" — replace the stripe
       fill with the actual page bg color if you need pixel-perfect blending. -->
  <g transform="translate(20, 20)">
    <g fill="#3B82F6">
      <circle cx="38" cy="68" r="15"/>
      <circle cx="60" cy="49" r="24"/>
      <circle cx="82" cy="62" r="19"/>
      <rect x="22" y="66" width="76" height="19" rx="9"/>
    </g>
    <g fill="#0F172A">
      <rect x="51" y="44" width="17" height="7" rx="2"/>
      <rect x="48" y="53" width="25" height="7" rx="2"/>
      <rect x="44" y="62" width="32" height="7" rx="2"/>
    </g>
  </g>
  <text x="160" y="105" font-family="'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#F8FAFC">Incuba</tspan><tspan fill="#3B82F6">Cloud</tspan>
  </text>
</svg>

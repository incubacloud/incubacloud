<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- IncubaCloud — solid app icon. Stripes drawn as overlay rects (gradient color)
       on top of the white cloud so it rasterizes correctly to PNG/ICO. -->
  <defs>
    <linearGradient id="icon-solid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="icon-solid-stripe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#icon-solid-grad)"/>
  <g transform="translate(5, 18) scale(2)">
    <!-- White cloud -->
    <g fill="#FFFFFF">
      <circle cx="38" cy="68" r="15"/>
      <circle cx="60" cy="49" r="24"/>
      <circle cx="82" cy="62" r="19"/>
      <rect x="22" y="66" width="76" height="19" rx="9"/>
    </g>
    <!-- Three horizontal stripes carved out — drawn in gradient color over the cloud -->
    <g fill="url(#icon-solid-stripe-grad)">
      <rect x="51" y="44" width="17" height="7" rx="2"/>
      <rect x="48" y="53" width="25" height="7" rx="2"/>
      <rect x="44" y="62" width="32" height="7" rx="2"/>
    </g>
  </g>
</svg>

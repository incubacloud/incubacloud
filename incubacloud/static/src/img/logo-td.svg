<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <!-- 
    IncubaCloud Dark Theme Logo with Tagline
    Includes descriptive subtitle for branding purposes
  -->
  
  <!-- Icon shifted slightly up to balance the tagline -->
  <g transform="translate(20, 15) scale(5)">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 15V5" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 8l3-3 3 3" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Logo Text -->
  <text x="160" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#F8FAFC">Incuba</tspan><tspan fill="#3B82F6">Cloud</tspan>
  </text>

  <!-- Tagline Text (Ortografía corregida: "Gestión" y "orquestación") -->
  <text x="165" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Gestión y orquestación de Odoo CE
  </text>
</svg>
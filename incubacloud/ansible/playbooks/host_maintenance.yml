---
# Reclaim disk on a host by pruning unused Docker resources. Driven by
# DockerPruneExecutor (a recurring cron job).
#
# The reclaimed-space line is exported back to the panel so the job log
# shows how much was freed.
- name: Prune unused Docker resources
  hosts: all
  gather_facts: false

  vars:
    # Resources carrying this label are excluded from the prune: they are
    # meant to stay around while stopped (a warm pool instance is a
    # stopped container by design, and an unfiltered prune wipes the
    # whole pool). DockerPruneExecutor.get_extra_vars() overrides this
    # with the same constant; the default keeps the playbook runnable
    # standalone with identical semantics.
    ic_protect_label: "incubacloud.protect=1"

  tasks:
    - name: Run docker system prune
      ansible.builtin.command:
        cmd: docker system prune -af --filter "label!={{ ic_protect_label }}"
      register: ic_prune
      changed_when: true

    # Post-prune inventory: every container still present, any state.
    # The panel compares it against the containers each deployed
    # instance must have, so a prune that swept a managed stack is
    # alerted the minute it happens instead of surfacing days later as
    # a failed backup. Docker's {{.Names}} template is wrapped in
    # {% raw %} so Ansible does not try to expand it as Jinja2.
    - name: Inventory the surviving containers
      ansible.builtin.command:
        cmd: "docker ps -a --format {% raw %}'{{.Names}}'{% endraw %}"
      register: ic_survivors
      changed_when: false

    - name: Export the reclaimed-space summary
      ansible.builtin.set_stats:
        aggregate: false
        data:
          ic_prune_stdout: "{{ ic_prune.stdout | default('') }}"
          ic_containers_after: "{{ ic_survivors.stdout | default('') }}"

---
# Tear a host down: stop the metrics agents and the shared Traefik
# reverse proxy and remove their directories. Driven by
# DeleteHostExecutor; the executor archives the cloud.host record
# afterwards.
#
# Idempotent: a host whose agents or Traefik were never deployed (or
# already removed) converges without error, so a half-finished teardown
# can be re-run safely.
- name: Tear down a cloud host
  hosts: all
  gather_facts: true

  vars:
    traefik_dir: "{{ ansible_env.HOME }}/traefik"
    # Where host_observability.yml installs the metrics agents, and root's
    # database collector with its schedule.
    ic_obs_dir: "{{ ansible_env.HOME }}/observability"
    ic_lib_dir: /usr/local/lib/incubacloud
    ic_pg_cron_file: /etc/cron.d/incubacloud-collect-pg

  tasks:
    # The metrics agents go first. Left running, a host the panel no
    # longer knows keeps pushing with this panel's credential, and the
    # series the panel deletes for it are recreated by the next scrape —
    # on a machine that outlives its record (a BYOH server) for ever.
    - name: Check whether the metrics agents are deployed
      ansible.builtin.stat:
        path: "{{ ic_obs_dir }}/docker-compose.yaml"
      register: ic_agents_compose

    - name: Stop the metrics agents
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml down
        chdir: "{{ ic_obs_dir }}"
      when: ic_agents_compose.stat.exists
      changed_when: true

    - name: Look for cron
      # Debian 13 ships without it, and the cron module fails without
      # crontab even to remove an entry: a server set up before the
      # agents' install put cron in failed its whole teardown. Without
      # cron there is no schedule to remove, and the log says so.
      ansible.builtin.stat:
        path: /usr/bin/crontab
      register: ic_crontab

    - name: Remove the disk usage collector
      when: ic_crontab.stat.exists
      ansible.builtin.cron:
        name: "incubacloud instance disk usage"
        state: absent

    - name: Say there is no schedule to remove
      when: not ic_crontab.stat.exists
      ansible.builtin.debug:
        msg: "cron is not installed: there is no scheduled task to remove."

    # Root's: the user's crontab above does not hold it. Looked for
    # first, so a host where it never ran needs no sudo here.
    - name: Look for the database collector
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ ic_pg_cron_file }}"
        - "{{ ic_lib_dir }}"
      register: ic_pg_collector_files

    - name: Remove the database collector
      # A sudo that no longer works must not stop the removal of the
      # host: what is left is said in the job's log.
      when: ic_pg_collector_files.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Remove the database collector, its schedule first
          become: "{{ ansible_user_id != 'root' }}"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ ic_pg_cron_file }}"
            - "{{ ic_lib_dir }}"
      rescue:
        - name: Say the database collector was left on the server
          ansible.builtin.debug:
            msg: >-
              The database collector could not be removed
              ({{ (ansible_failed_result.msg | default('') | string)[:300] }}).
              Remove {{ ic_pg_cron_file }} and {{ ic_lib_dir }} as root on
              this server.

    - name: Remove the agents' directory
      # It holds this panel's metrics credential in clear.
      ansible.builtin.file:
        path: "{{ ic_obs_dir }}"
        state: absent

    - name: Check whether Traefik is deployed
      ansible.builtin.stat:
        path: "{{ traefik_dir }}/inverseproxy.yaml"
      register: ic_traefik_compose

    - name: Stop the Traefik stack
      ansible.builtin.command:
        cmd: docker compose -p inverseproxy -f inverseproxy.yaml down
        chdir: "{{ traefik_dir }}"
      when: ic_traefik_compose.stat.exists
      changed_when: true

    - name: Remove the Traefik directory
      ansible.builtin.file:
        path: "{{ traefik_dir }}"
        state: absent

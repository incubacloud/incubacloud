---
# Install the per-host observability agents. Driven by
# ObservabilityAgentsExecutor.
#
# Three containers, deployed as one compose stack — the same shape the
# host already runs for Traefik and the global whitelist, so nothing new
# has to be learned or maintained per distro:
#
#   node_exporter  system metrics (CPU/RAM/disk/net) + textfile collector
#   cAdvisor       per-container metrics
#   vmagent        scrapes both locals and PUSHES outbound (remote-write)
#
# Push, not scrape, is the whole point (P9): no inbound port is opened on
# the host, so BYOH boxes behind NAT work exactly like ours.
#
# Labels are attached HERE, at ingest, not bolted on later: every sample
# carries host/instance/project (and tenant, when the SaaS layer supplies
# it). Retrofitting labels onto historical series is not possible, which
# is why this is done from the first deploy.
- name: Install observability agents
  hosts: all
  gather_facts: true

  vars:
    ic_obs_dir: "{{ ansible_env.HOME }}/observability"
    ic_remote_write_url: ""
    # Where access logs are pushed. Empty disables collection entirely
    # rather than starting a collector that pushes into the void.
    ic_logs_write_url: ""
    # The direct path, when the panel offers
    # it: the URLs and what to try first. Empty: the URLs above, as before.
    ic_direct_write_url: ""
    ic_direct_logs_write_url: ""
    ic_direct_probes: []
    ic_remote_write_token: ""
    # User half of the credential, and the account this panel writes as.
    # The central overwrites the label from whoever authenticates, so
    # what the agent claims here is only a local convenience.
    ic_remote_write_user: ""
    ic_account: ""
    ic_host_id: ""
    ic_host_name: ""
    # [{compose_project, instance_id, instance, project, tenant,
    #   traefik_prefix, traefik_extra}, ...]
    ic_instances: []
    ic_promtail_image: "grafana/promtail:2.9.8"
    ic_node_exporter_image: "quay.io/prometheus/node-exporter:v1.8.2"
    # v0.54.0+ is REQUIRED, not merely preferred: Docker 28/29 default to
    # the containerd image store, and older cAdvisor (v0.52 and below)
    # cannot resolve container metadata under it — it silently registers
    # zero containers, so per-instance metrics simply never appear.
    # Measured on Docker 29.6: v0.52.1 → 0 labelled series, v0.54.1 and
    # v0.55.1 → 54. Do not pin this back down.
    ic_cadvisor_image: "gcr.io/cadvisor/cadvisor:v0.55.1"
    ic_vmagent_image: "victoriametrics/vmagent:v1.102.0"
    # The database collector (``collect_pg.sh``), on unless the panel's
    # setting switches it off, which removes it. Root's, outside the
    # connecting user's home: its script, its list of databases and its
    # schedule are files that user cannot change.
    ic_collect_pg: true
    ic_lib_dir: /usr/local/lib/incubacloud
    ic_pg_cron_file: /etc/cron.d/incubacloud-collect-pg
    # Below this much memory a server measures its filestores once an
    # hour instead of every ten minutes: on the 2 and 4 GB servers the
    # I/O of a ``du`` over hundreds of thousands of files is felt by the
    # instances (review of 12-nov-2026).
    ic_filestore_hourly_below_mb: 6144

  tasks:
    - name: Detect whether Traefik runs on this host
      # Traefik's metrics port is deliberately NOT published to the host:
      # publishing on 127.0.0.1 would be unreachable from vmagent's
      # container (a container's loopback is its own), and publishing on
      # 0.0.0.0 would expose instance names and domains to the internet
      # on any host that is not hardened. Joining Traefik's own docker
      # network and scraping it by service name avoids both. Its
      # ``public`` network, never ``shared``: every instance on the host
      # joins ``shared``, so an agent there is within reach of all of
      # them, and the proxy answers its metrics on ``public`` alone
      # (``full_setup_executor.PROXY_PUBLIC_HOST``).
      ansible.builtin.command: docker network inspect inverseproxy_public
      register: ic_traefik_net
      changed_when: false
      failed_when: false

    - name: Note whether the Traefik scrape applies
      ansible.builtin.set_fact:
        ic_has_traefik: "{{ ic_traefik_net.rc == 0 }}"

    - name: Try the direct path from this host
      # The central's probe runs from the central's host and cannot see
      # this host's way out: a customer's server that blocks the port, or
      # a firewall in between, is only seen from here. Each check is what
      # the panel expects without a credential (vmauth's 401, a JWKS's
      # 200), with the system's roots: a certificate nobody trusts fails.
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: "{{ item.method }}"
        status_code: ["{{ item.status }}"]
        validate_certs: true
        timeout: 10
      loop: "{{ ic_direct_probes }}"
      register: ic_direct_tries
      failed_when: false
      changed_when: false
      when: ic_direct_write_url | length > 0

    - name: Note what the direct path answered
      ansible.builtin.set_fact:
        ic_direct_report: >-
          [{% for r in ic_direct_tries.results | default([]) %}{"url": {{ r.item.url |
          default('') | to_json }}, "status": {{ r.status | default(-1) | int }}, "msg": {{
          (r.msg | default('') | string)[:300] | to_json }}}{{ "," if not loop.last else ""
          }}{% endfor %}]

    - name: Choose where the agents write
      # Every check answered as expected, or the public URLs. What was
      # pending in vmagent's queue for the other URL stays behind.
      ansible.builtin.set_fact:
        ic_direct_ok: >-
          {{ (ic_direct_write_url | length > 0)
             and (((ic_direct_report | from_json) if ic_direct_report is string else
          ic_direct_report)
                  | map(attribute='status') | map('int') | list)
                 == (ic_direct_probes | map(attribute='status') | map('int') | list) }}

    - name: Name the URLs the agents use
      ansible.builtin.set_fact:
        ic_write_url:
          "{{ ic_direct_write_url if (ic_direct_ok | bool) else ic_remote_write_url }}"
        ic_logs_url:
          "{{ ic_direct_logs_write_url if (ic_direct_ok | bool) else ic_logs_write_url }}"

    - name: Create the observability directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ic_obs_dir }}"
        - "{{ ic_obs_dir }}/textfile"
        # Where the log collector remembers how far it read each file, so
        # a restart does not send the 30-day access log again.
        - "{{ ic_obs_dir }}/promtail-positions"

    - name: Write the remote-write credentials
      # 0600: this secret authorises writes into the central. It is
      # passed in as an extra-var (never committed) and never echoed into
      # the job log.
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/.remote_write_token"
        content: "{{ ic_remote_write_token }}"
        mode: "0600"
      no_log: true

    - name: Write the vmagent scrape configuration
      # Relabelling maps each container back to the instance that owns it.
      # cAdvisor exposes the compose project as
      # ``container_label_com_docker_compose_project``; the panel sets that
      # to ``doodba_project_name`` at deploy time, so it is a stable join
      # key that survives renames of anything else.
      #
      # Traefik is joinable too, and an earlier note in this file claimed
      # the opposite — that its service names were copier-time literals
      # unrelated to anything we control, so per-instance HTTP had to wait
      # for a later phase. That came from surveying doodba projects
      # scaffolded by hand, where ``project_name`` is whatever their author
      # typed. It does not describe instances the panel deploys, which is
      # all of them: the panel runs ``copier copy`` itself and
      # ``_render_copier_answers()`` passes
      # ``project_name = doodba_project_name`` — the same string forced
      # into COMPOSE_PROJECT_NAME. Traefik therefore reports under
      # ``<doodba_project_name>-<version, dots as dashes>-prod-<main|longpolling>@docker``
      # (routers: ``https-<same>-prod-<purpose>-<n>@docker``), verified
      # against a running proxy. A deployment layer above core may put an
      # extra router in front of an instance; when it does, mapping that
      # name is the job of the layer that created it, not of this playbook.
      #
      # The labels people name (a project's, and any a module fills in)
      # are written through ``to_json``, a JSON string being a YAML scalar,
      # so whatever they hold stays one value of the file.
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/scrape.yml"
        mode: "0644"
        content: |
          global:
            scrape_interval: 30s
            external_labels:
              host: "{{ ic_host_name }}"
              host_id: "{{ ic_host_id }}"
              # host_id is only unique within one panel's database, so on
              # a shared central the pair (ic_account, host_id) is what
              # identifies a host. Set here as a global label so it
              # covers node_exporter, cAdvisor, Traefik and the textfile
              # collector at once. The central overwrites it from the
              # authenticated user, which is what makes it trustworthy.
              ic_account: "{{ ic_account }}"

          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]

          {% if ic_has_traefik %}
            # Scraped over the proxy's ``public`` network, by service name.
            # This is where per-instance HTTP rates/latencies come from,
            # with no agent inside the instances. Only emitted when
            # Traefik is actually on this host: a job pointing at nothing
            # would sit at up=0 forever and look like a real outage.
            - job_name: traefik
              static_configs:
                - targets: ["proxy:8082"]
              # Attribute each sample to the instance that answers under
              # that service. The names are derived, not guessed: the
              # panel feeds copier ``project_name = doodba_project_name``,
              # the same string it forces into COMPOSE_PROJECT_NAME, so
              # the prefix below is computed from panel state.
              #
              # Only the prefix is matched because the suffix varies by
              # role and environment (``-prod-main``,
              # ``-prod-longpolling``, ``-test-…``). Routers additionally
              # carry an ``https-`` prefix in the template's output,
              # hence the optional group.
              metric_relabel_configs:
          {% for inst in ic_instances %}
          {% if inst.traefik_prefix %}
                - source_labels: [service]
                  regex: "{{ inst.traefik_prefix }}.*"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [service]
                  regex: "{{ inst.traefik_prefix }}.*"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
                - source_labels: [service]
                  regex: "{{ inst.traefik_prefix }}.*"
                  target_label: project
                  replacement: {{ inst.project | to_json(ensure_ascii=False) }}
                - source_labels: [router]
                  regex: "(https-)?{{ inst.traefik_prefix }}.*"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [router]
                  regex: "(https-)?{{ inst.traefik_prefix }}.*"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
          {% endif %}
          {% for extra in inst.traefik_extra | default([]) %}
                # An upper layer put its own router in front of this
                # instance, so traffic reports under that name instead.
                - source_labels: [service]
                  regex: "{{ extra }}"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [service]
                  regex: "{{ extra }}"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
          {% endfor %}
          {% endfor %}
          {% endif %}

            - job_name: cadvisor
              static_configs:
                - targets: ["cadvisor:8080"]
              metric_relabel_configs:
          {% for inst in ic_instances %}
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: project
                  replacement: {{ inst.project | to_json(ensure_ascii=False) }}
          {% if inst.tenant %}
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: tenant
                  replacement: {{ inst.tenant | to_json(ensure_ascii=False) }}
          {% endif %}
          {% if inst.tenant_id %}
                # The id, not just the slug: it survives a tenant rename,
                # so it is what per-tenant isolation can safely key on.
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: tenant_id
                  replacement: "{{ inst.tenant_id }}"
          {% endif %}
          {% endfor %}
      register: ic_scrape_cfg

    - name: Write the access-log collector configuration
      # The proxy's access log, from the file it writes on the host
      # (1.0.183) -- and from its container output while the host has not
      # been set up since and still logs there; the two never overlap.
      # Only JSON access lines are kept. The service name becomes a label,
      # which is what makes "show me this instance's requests" a cheap
      # query -- its cardinality is bounded by the instances on this host,
      # not by anything unbounded like a path or an IP.
      #
      # When the panel says so, the host's security logs as well: SSH and
      # sudo from the journal, auditd and fail2ban from their files. The
      # central keeps them 90 days (``log_type="security"``), and this
      # host's credential can add lines there but never delete them.
      when: ic_logs_url | length > 0
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/promtail.yaml"
        mode: "0644"
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          positions:
            filename: /var/lib/promtail/positions.yaml
          clients:
            - url: {{ ic_logs_url }}
              basic_auth:
                username: {{ ic_remote_write_user }}
                password_file: /etc/remote_write_token
          scrape_configs:
            - job_name: traefik-access-file
              static_configs:
                - targets: [localhost]
                  labels:
                    job: traefik-access
                    host: "{{ ic_host_name }}"
                    __path__: /var/log/traefik/access.log
              pipeline_stages:
                - drop:
                    expression: '^[^{]'
                - json:
                    expressions:
                      service: ServiceName
                      status: DownstreamStatus
                - labels:
                    service:
          {% if ic_ship_security_logs | default(false) | bool %}
            - job_name: security-journal
              journal:
                path: /var/log/journal
                max_age: 12h
                labels:
                  log_type: security
                  host: "{{ ic_host_name }}"
              relabel_configs:
                - source_labels: ['__journal__systemd_unit', '__journal_syslog_identifier']
                  separator: ';'
                  regex: '(ssh|sshd)(@[^;]*)?\.service;.*|fail2ban\.service;.*|.*;sudo'
                  action: keep
                - source_labels: ['__journal_syslog_identifier']
                  target_label: source
            - job_name: security-files
              static_configs:
                - targets: [localhost]
                  labels:
                    log_type: security
                    source: auditd
                    host: "{{ ic_host_name }}"
                    __path__: /var/log/audit/audit.log
                - targets: [localhost]
                  labels:
                    log_type: security
                    source: fail2ban
                    host: "{{ ic_host_name }}"
                    __path__: /var/log/fail2ban.log
          {% endif %}
            - job_name: traefik-access
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 30s
                  filters:
                    - name: name
                      values: ["inverseproxy-proxy-1"]
              relabel_configs:
                - source_labels: ['__meta_docker_container_name']
                  target_label: container
                - target_label: host
                  replacement: "{{ ic_host_name }}"
              pipeline_stages:
                # Everything Traefik writes that is not an access line
                # starts with something other than a brace.
                - drop:
                    expression: '^[^{]'
                - json:
                    expressions:
                      service: ServiceName
                      status: DownstreamStatus
                - labels:
                    service:
      register: ic_promtail_cfg

    - name: Write the agents compose file
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/docker-compose.yaml"
        mode: "0644"
        content: |
          services:
            node-exporter:
              image: {{ ic_node_exporter_image }}
              restart: unless-stopped
              pid: host
              command:
                - '--path.rootfs=/host'
                - '--collector.textfile.directory=/textfile'
              volumes:
                - /:/host:ro,rslave
                - {{ ic_obs_dir }}/textfile:/textfile:ro

            cadvisor:
              image: {{ ic_cadvisor_image }}
              restart: unless-stopped
              privileged: true
              command:
                # cAdvisor does NOT expose container labels by default, so
                # without this the relabelling below matches nothing and
                # every container metric is unattributable — metrics arrive,
                # but no instance can ever be identified. Verified live: the
                # rules were correct and still produced zero series.
                #
                # Whitelist rather than --store_container_labels=true: the
                # latter turns every Docker label into a metric label, which
                # is the classic cAdvisor cardinality blow-up.
                - '--store_container_labels=false'
                - '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
                # Skip the host's own cgroups (/init.scope and friends).
                - '--docker_only=true'
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker/:/var/lib/docker:ro
                - /dev/disk/:/dev/disk:ro

          {% if ic_logs_url %}
            promtail:
              image: {{ ic_promtail_image }}
              restart: unless-stopped
              command: ['-config.file=/etc/promtail/promtail.yaml']
              volumes:
                - {{ ic_obs_dir }}/promtail.yaml:/etc/promtail/promtail.yaml:ro
                - {{ ic_obs_dir }}/.remote_write_token:/etc/remote_write_token:ro
                - {{ ic_obs_dir }}/promtail-positions:/var/lib/promtail
                # Read-only: the access log, and -- when sent -- auditd,
                # fail2ban and the journal all live under /var/log.
                - /var/log:/var/log:ro
                # The journal reader needs the machine id to find it.
                - /etc/machine-id:/etc/machine-id:ro
                # Read-only socket: it only needs to discover and read the
                # proxy container's log stream on hosts not set up since
                # the access log moved to its file.
                - /var/run/docker.sock:/var/run/docker.sock:ro
          {% endif %}

            vmagent:
              image: {{ ic_vmagent_image }}
              restart: unless-stopped
              # host-gateway is how the agent reaches a co-located central
              # (the remote-write URL); Traefik is reached over its own
              # network instead — see the networks block below.
              extra_hosts:
                - "host.docker.internal:host-gateway"
              networks:
                - default
          {% if ic_has_traefik %}
                - traefik
          {% endif %}
              command:
                # Its own loopback only. On ``:8429`` of every interface it
                # took series from anything that reached it and forwarded
                # them to the central under this host's credential — an
                # instance's visits that never happened, for one. Nothing
                # reads this port from another container: agents push.
                - '-httpListenAddr=127.0.0.1:8429'
                - '-promscrape.config=/etc/scrape.yml'
                - '-remoteWrite.url={{ ic_write_url }}'
                # Basic auth, not bearer: single-node VictoriaMetrics
                # only knows how to check -httpAuth.*, so a bearer token
                # was accepted-and-ignored by the central and authorised
                # nothing at all. Same secret, a scheme that is enforced.
                - '-remoteWrite.basicAuth.username={{ ic_remote_write_user }}'
                - '-remoteWrite.basicAuth.passwordFile=/etc/remote_write_token'
                # Survive a central outage instead of dropping samples.
                - '-remoteWrite.maxDiskUsagePerURL=512MB'
              volumes:
                - {{ ic_obs_dir }}/scrape.yml:/etc/scrape.yml:ro
                - {{ ic_obs_dir }}/.remote_write_token:/etc/remote_write_token:ro
                - vmagent-data:/vmagentdata
              depends_on:
                - node-exporter
                - cadvisor

          volumes:
            vmagent-data:

          networks:
            default:
          {% if ic_has_traefik %}
            traefik:
              external: true
              name: inverseproxy_public
          {% endif %}
      register: ic_agents_compose

    - name: Install the per-instance disk usage collector
      # node_exporter's textfile collector turns a plain script into
      # metrics. Disk per instance is the one number cAdvisor cannot give
      # (it measures containers, not the deploy directory).
      #
      # ``inst.dir`` arrives as the panel stores it — ``~/<folder>/<name>``
      # unless the instance pins an absolute one. The tilde is expanded
      # HERE, while rendering, because bash never expands one that reaches
      # it as data: neither inside double quotes nor through a variable.
      # Left literal, the ``[ -d ]`` below is false for every instance, du
      # never runs, and the .prom file ends up holding nothing but its two
      # header lines — which reads as "no data", not as a bug. This is the
      # same expansion ``ic_expand_home`` does for the scripts that go
      # through run_script(); this template is the one generator that does
      # not, so it repeats it rather than sourcing lib/common.sh.
      #
      # Besides each directory, two figures that ask the instance's own
      # containers, run as their user ``docker exec`` (12-nov-2026):
      #
      #   * its database's size, ``pg_database_size``, with the ``db``
      #     container's psql. Ten minutes and not with the per-minute
      #     database collector: on 6 700 files it cost that collector half
      #     of its CPU (46 of 124 ms per instance, F0 of the observability
      #     plan, 9-nov-2026).
      #   * its filestore's size, ``du`` inside the ``odoo`` container
      #     under ``nice``/``ionice`` and a ``timeout`` of its own: run from
      #     here they would lower the docker client, not ``du``, which
      #     containerd starts. Every pass on a server of 6 GB or more, once
      #     an hour below (``ic_filestore_hourly_below_mb``), kept in a file
      #     of its own so the hour between keeps the last reading.
      #
      # A stopped instance (asleep) has no container to ask: its
      # directory is measured, its database and filestore are not. One
      # pass at a time: a filestore that takes long does not pile passes up.
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/collect_disk.sh"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Auto-generated by IncubaCloud. Emits per-instance disk usage
          # for node_exporter's textfile collector. Written atomically:
          # node_exporter must never read a half-written file.
          # The name label is ``instance_name``, not ``instance``: the
          # scraper owns ``instance`` (it sets it to the target address)
          # and renames whatever the exposed metric called that to
          # ``exported_instance``. Emitting it under a name of our own
          # keeps the label the panel reads stable, instead of depending
          # on a collision-renaming rule.
          set -euo pipefail
          out="{{ ic_obs_dir }}/textfile/ic_instance_disk.prom"
          tmp="${out}.$$"
          fs_out="{{ ic_obs_dir }}/textfile/ic_instance_filestore.prom"
          fs_tmp="${fs_out}.$$"
          exec 9>"{{ ic_obs_dir }}/.collect_disk.lock"
          flock -n 9 || exit 0
          # Minutes a filestore reading stands for, less five of slack.
          fs_fresh={{ (60 if (ansible_memtotal_mb | int) < (ic_filestore_hourly_below_mb | int) else 10) - 5 }}
          measure_fs=0
          if [ ! -e "$fs_out" ] || [ -z "$(find "$fs_out" -mmin "-$fs_fresh" 2>/dev/null)" ]; then
            measure_fs=1
          fi
          declare -A ODOO=() DB=()
          while read -r project service id; do
            case "$service" in
              odoo) ODOO[$project]=$id ;;
              db) DB[$project]=$id ;;
            esac
          done < <(timeout 20 docker ps --filter label=com.docker.compose.service \
            --format '{% raw %}{{.Label "com.docker.compose.project"}} {{.Label "com.docker.compose.service"}} {{.ID}}{% endraw %}' 2>/dev/null || true)
          # db_size PROJECT DBNAME DBUSER: the database's size in bytes.
          db_size() {
            local id="${DB[$1]:-}"
            [ -n "$id" ] || return 1
            timeout 30 docker exec -e PGCONNECT_TIMEOUT=3 \
              -e "PGOPTIONS=-c statement_timeout=10000 -c default_transaction_read_only=on" \
              "$id" psql -X -w -q -A -t -U "$3" -d "$2" \
              -c "SELECT pg_database_size(current_database())" 2>/dev/null
          }
          # filestore_size PROJECT DBNAME: the filestore's size in bytes.
          filestore_size() {
            local id="${ODOO[$1]:-}"
            [ -n "$id" ] || return 1
            # shellcheck disable=SC2016  # expanded by the container's sh
            timeout 150 docker exec "$id" sh -c 'p="/var/lib/odoo/filestore/$1"; [ -d "$p" ] || exit 1
              if command -v ionice >/dev/null 2>&1; then exec timeout 120 nice -n 19 ionice -c 3 du -sb "$p"; fi
              exec timeout 120 nice -n 19 du -sb "$p"' sh "$2" 2>/dev/null | awk '{print $1}'
          }
          {
            echo "# HELP ic_instance_disk_bytes Disk used by an instance directory."
            echo "# TYPE ic_instance_disk_bytes gauge"
          {% for inst in ic_instances %}
          {% set inst_dir = inst.dir | regex_replace('^~/', ansible_env.HOME ~ '/') %}
            if [ -d "{{ inst_dir }}" ]; then
              size=$(du -sb "{{ inst_dir }}" 2>/dev/null | awk '{print $1}') || size=""
              [ -n "${size:-}" ] && printf 'ic_instance_disk_bytes{instance_id="%s",instance_name="%s"} %s\n' \
                '{{ inst.instance_id }}' '{{ inst.instance }}' "$size"
            fi
          {% endfor %}
            echo "# HELP ic_pg_db_size_bytes Size of an instance's database."
            echo "# TYPE ic_pg_db_size_bytes gauge"
          {% for inst in ic_instances %}
            size=$(db_size '{{ inst.compose_project }}' '{{ inst.dbname }}' '{{ inst.dbuser }}') || size=""
            [[ "$size" =~ ^[0-9]+$ ]] && printf 'ic_pg_db_size_bytes{instance_id="%s",instance_name="%s"} %s\n' \
              '{{ inst.instance_id }}' '{{ inst.instance }}' "$size"
          {% endfor %}
            true
          } > "$tmp"
          mv "$tmp" "$out"
          if [ "$measure_fs" = 1 ]; then
            {
              echo "# HELP ic_instance_filestore_bytes Size of an instance's filestore."
              echo "# TYPE ic_instance_filestore_bytes gauge"
          {% for inst in ic_instances %}
              size=$(filestore_size '{{ inst.compose_project }}' '{{ inst.dbname }}') || size=""
              [[ "$size" =~ ^[0-9]+$ ]] && printf 'ic_instance_filestore_bytes{instance_id="%s",instance_name="%s"} %s\n' \
                '{{ inst.instance_id }}' '{{ inst.instance }}' "$size"
          {% endfor %}
              true
            } > "$fs_tmp"
            mv "$fs_tmp" "$fs_out"
          fi

    - name: Schedule the disk collector
      ansible.builtin.cron:
        name: "incubacloud instance disk usage"
        minute: "*/10"
        job: "{{ ic_obs_dir }}/collect_disk.sh >/dev/null 2>&1"

    # ── The database collector (collect_pg.sh) ─────────────────────────
    # Every minute, each running instance's connections, queries, lock
    # waits and cache hits, read with the host's psql through the socket of
    # its ``db`` container as that container's filesystem shows it
    # (``/proc/<pid>/root``), which only root can open: 83 ms of CPU per
    # instance, 2.8 % of a core with twenty (F0 of the observability plan,
    # 9-nov-2026; the owner chose every minute and root on 10-nov-2026).
    # Root is no more than the connecting user already holds through the
    # docker group and sudo; what root runs is root's: the script, its list
    # and its schedule live in ``ic_lib_dir`` and /etc/cron.d, never in
    # that user's home.
    #
    # This job runs at the end of every deploy, move and removal, and a
    # failed one marks the host failed, retries and alerts. So nothing of
    # the collector may fail it: whatever goes wrong here (no passwordless
    # sudo, apt's lock held by an upgrade, no package) leaves the agents
    # installed, says so in the job's log and on the server's board, and
    # the next run of this job tries again.
    - name: Note whether this run connects as root
      ansible.builtin.set_fact:
        ic_as_root: "{{ ansible_user_id == 'root' }}"
        ic_pg_collector: "off"
        ic_pg_collector_error: ""

    - name: Install the database collector
      when: ic_collect_pg | bool
      block:
        - name: Check that sudo asks no password
          ansible.builtin.command: sudo -n true
          when: not (ic_as_root | bool)
          changed_when: false

        - name: Look for a PostgreSQL client
          # Full Setup installs it; a server set up before that, or by
          # hand, may lack it.
          ansible.builtin.command: psql --version
          register: ic_psql
          changed_when: false
          failed_when: false

        - name: Install the PostgreSQL client
          when: ic_psql.rc != 0
          become: "{{ not (ic_as_root | bool) }}"
          ansible.builtin.apt:
            name: postgresql-client
            state: present
            update_cache: true
            cache_valid_time: 86400
            # An unattended upgrade holding the lock fails this, not the job.
            lock_timeout: 60

        - name: Create the collector's directory
          become: "{{ not (ic_as_root | bool) }}"
          ansible.builtin.file:
            path: "{{ ic_lib_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install the collector
          become: "{{ not (ic_as_root | bool) }}"
          ansible.builtin.copy:
            src: collect_pg.sh
            dest: "{{ ic_lib_dir }}/collect_pg.sh"
            owner: root
            group: root
            mode: "0755"

        - name: Write the databases the collector reads
          # Names and identifiers the panel only accepts shell-safe.
          become: "{{ not (ic_as_root | bool) }}"
          ansible.builtin.copy:
            dest: "{{ ic_lib_dir }}/collect_pg.instances"
            owner: root
            group: root
            mode: "0644"
            content: |
              # instance_id instance_name compose_project dbname dbuser
              {% for inst in ic_instances %}
              {{ inst.instance_id }} {{ inst.instance }} {{ inst.compose_project }} {{ inst.dbname }} {{ inst.dbuser }}
              {% endfor %}

        - name: Schedule the collector every minute, as root
          become: "{{ not (ic_as_root | bool) }}"
          ansible.builtin.copy:
            dest: "{{ ic_pg_cron_file }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              # Installed by IncubaCloud's observability agents: each
              # instance's database figures, for node_exporter.
              SHELL=/bin/sh
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              * * * * * root {{ ic_lib_dir }}/collect_pg.sh {{ ic_lib_dir }}/collect_pg.instances {{ ic_obs_dir }}/textfile >/dev/null 2>&1

        - name: Note the collector installed
          ansible.builtin.set_fact:
            ic_pg_collector: installed
      rescue:
        - name: Note the collector not installed, and why
          ansible.builtin.set_fact:
            ic_pg_collector: failed
            ic_pg_collector_error: >-
              {{ ansible_failed_task.name | default('') }}:
              {{ (ansible_failed_result.msg | default('') | string)[:300] }}

    - name: Remove the database collector, switched off
      # The setting is how it is turned off without going back a version:
      # a playbook from before it would leave root's schedule in place.
      when: not (ic_collect_pg | bool)
      block:
        - name: Look for the collector's schedule
          ansible.builtin.stat:
            path: "{{ ic_pg_cron_file }}"
          register: ic_pg_cron_present

        - name: Remove the collector's schedule and files
          become: "{{ not (ic_as_root | bool) }}"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ ic_pg_cron_file }}"
            - "{{ ic_lib_dir }}/collect_pg.sh"
            - "{{ ic_lib_dir }}/collect_pg.instances"
          when: ic_pg_cron_present.stat.exists

        - name: Remove the collector's last readings
          ansible.builtin.file:
            path: "{{ ic_obs_dir }}/textfile/{{ item }}"
            state: absent
          loop:
            - ic_pg.prom
            - ic_pg_collector.prom
      rescue:
        - name: Note the collector not removed, and why
          ansible.builtin.set_fact:
            ic_pg_collector: failed
            ic_pg_collector_error: >-
              {{ ansible_failed_task.name | default('') }}:
              {{ (ansible_failed_result.msg | default('') | string)[:300] }}

    - name: Say on the server's board whether the collector runs
      # 1 installed, 0 not: the board tells a collector that could not be
      # installed from a database with nothing to say.
      when: ic_collect_pg | bool
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/textfile/ic_pg_collector.prom"
        mode: "0644"
        content: |
          # HELP ic_pg_collector Whether the database collector is installed on this server.
          # TYPE ic_pg_collector gauge
          ic_pg_collector {{ 1 if ic_pg_collector == 'installed' else 0 }}

    - name: Bring the agents up
      # Retried on purpose. Compose pulls the three images concurrently,
      # and a freshly installed Docker occasionally fails one of them with
      # "lease does not exist: not found" — a containerd race, not a
      # configuration problem. Observed on a real first-boot host; the
      # pull succeeds on the next attempt.
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml up -d --remove-orphans
        chdir: "{{ ic_obs_dir }}"
      register: ic_agents_up
      retries: 3
      delay: 10
      until: ic_agents_up.rc == 0
      changed_when: true

    - name: Restart vmagent when its configuration changed
      # ``up -d`` does not restart a container whose image and compose
      # definition are unchanged, so a new scrape config alone would not
      # be picked up.
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml restart vmagent
        chdir: "{{ ic_obs_dir }}"
      when: ic_scrape_cfg is changed and ic_agents_compose is not changed
      changed_when: true

    - name: Restart promtail when its configuration changed  # noqa: no-handler
      # Same reason as vmagent's: a new push URL alone does not recreate
      # the container, and promtail reads its file at start only. Whether
      # the compose file changed too says nothing: a new URL for vmagent
      # changes it, and only vmagent is recreated (1-nov-2026).
      ansible.builtin.command:
        cmd:
          docker compose -p incubacloud-observability -f docker-compose.yaml restart
          promtail
        chdir: "{{ ic_obs_dir }}"
      when: ic_promtail_cfg is changed
      changed_when: true

    - name: Wait for the agents to report healthy
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml ps --format '{% raw %}{{.Service}} {{.State}}{% endraw %}'
        chdir: "{{ ic_obs_dir }}"
      register: ic_agents_ps
      changed_when: false

    - name: Export the agent facts
      ansible.builtin.set_stats:
        aggregate: false
        data:
          ic_agents_running: "{{ ic_agents_ps.stdout_lines | select('search', 'running') | list | length }}"
          ic_instances_labelled: "{{ ic_instances | length }}"
          ic_write_url_installed: "{{ ic_write_url }}"
          # installed, failed or off, and what failed.
          ic_pg_collector: "{{ ic_pg_collector }}"
          ic_pg_collector_error: "{{ ic_pg_collector_error }}"
          ic_direct_report:
            "{{ ic_direct_report if ic_direct_report is string else (ic_direct_report | to_json)
            }}"

---
# Install the per-host observability agents. Driven by
# ObservabilityAgentsExecutor.
#
# Three containers, deployed as one compose stack — the same shape the
# host already runs for Traefik and the global whitelist, so nothing new
# has to be learned or maintained per distro:
#
#   node_exporter  system metrics (CPU/RAM/disk/net) + textfile collector
#   cAdvisor       per-container metrics
#   vmagent        scrapes both locals and PUSHES outbound (remote-write)
#
# Push, not scrape, is the whole point (P9): no inbound port is opened on
# the host, so BYOH boxes behind NAT work exactly like ours.
#
# Labels are attached HERE, at ingest, not bolted on later: every sample
# carries host/instance/project (and tenant, when the SaaS layer supplies
# it). Retrofitting labels onto historical series is not possible, which
# is why this is done from the first deploy.
- name: Install observability agents
  hosts: all
  gather_facts: true

  vars:
    ic_obs_dir: "{{ ansible_env.HOME }}/observability"
    ic_remote_write_url: ""
    # Where access logs are pushed. Empty disables collection entirely
    # rather than starting a collector that pushes into the void.
    ic_logs_write_url: ""
    ic_remote_write_token: ""
    # User half of the credential, and the account this panel writes as.
    # The central overwrites the label from whoever authenticates, so
    # what the agent claims here is only a local convenience.
    ic_remote_write_user: ""
    ic_account: ""
    ic_host_id: ""
    ic_host_name: ""
    # [{compose_project, instance_id, instance, project, tenant,
    #   traefik_prefix, traefik_extra}, ...]
    ic_instances: []
    ic_promtail_image: "grafana/promtail:2.9.8"
    ic_node_exporter_image: "quay.io/prometheus/node-exporter:v1.8.2"
    # v0.54.0+ is REQUIRED, not merely preferred: Docker 28/29 default to
    # the containerd image store, and older cAdvisor (v0.52 and below)
    # cannot resolve container metadata under it — it silently registers
    # zero containers, so per-instance metrics simply never appear.
    # Measured on Docker 29.6: v0.52.1 → 0 labelled series, v0.54.1 and
    # v0.55.1 → 54. Do not pin this back down.
    ic_cadvisor_image: "gcr.io/cadvisor/cadvisor:v0.55.1"
    ic_vmagent_image: "victoriametrics/vmagent:v1.102.0"

  tasks:
    - name: Detect whether Traefik runs on this host
      # Traefik's metrics port is deliberately NOT published to the host:
      # publishing on 127.0.0.1 would be unreachable from vmagent's
      # container (a container's loopback is its own), and publishing on
      # 0.0.0.0 would expose instance names and domains to the internet
      # on any host that is not hardened. Joining Traefik's own docker
      # network and scraping it by service name avoids both.
      ansible.builtin.command: docker network inspect inverseproxy_shared
      register: ic_traefik_net
      changed_when: false
      failed_when: false

    - name: Note whether the Traefik scrape applies
      ansible.builtin.set_fact:
        ic_has_traefik: "{{ ic_traefik_net.rc == 0 }}"

    - name: Create the observability directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ic_obs_dir }}"
        - "{{ ic_obs_dir }}/textfile"

    - name: Write the remote-write credentials
      # 0600: this secret authorises writes into the central. It is
      # passed in as an extra-var (never committed) and never echoed into
      # the job log.
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/.remote_write_token"
        content: "{{ ic_remote_write_token }}"
        mode: "0600"
      no_log: true

    - name: Write the vmagent scrape configuration
      # Relabelling maps each container back to the instance that owns it.
      # cAdvisor exposes the compose project as
      # ``container_label_com_docker_compose_project``; the panel sets that
      # to ``doodba_project_name`` at deploy time, so it is a stable join
      # key that survives renames of anything else.
      #
      # Traefik is joinable too, and an earlier note in this file claimed
      # the opposite — that its service names were copier-time literals
      # unrelated to anything we control, so per-instance HTTP had to wait
      # for a later phase. That came from surveying doodba projects
      # scaffolded by hand, where ``project_name`` is whatever their author
      # typed. It does not describe instances the panel deploys, which is
      # all of them: the panel runs ``copier copy`` itself and
      # ``_render_copier_answers()`` passes
      # ``project_name = doodba_project_name`` — the same string forced
      # into COMPOSE_PROJECT_NAME. Traefik therefore reports under
      # ``<doodba_project_name>-<version, dots as dashes>-prod-<main|longpolling>@docker``
      # (routers: ``https-<same>-prod-<purpose>-<n>@docker``), verified
      # against a running proxy. A deployment layer above core may put an
      # extra router in front of an instance; when it does, mapping that
      # name is the job of the layer that created it, not of this playbook.
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/scrape.yml"
        mode: "0644"
        content: |
          global:
            scrape_interval: 30s
            external_labels:
              host: "{{ ic_host_name }}"
              host_id: "{{ ic_host_id }}"
              # host_id is only unique within one panel's database, so on
              # a shared central the pair (ic_account, host_id) is what
              # identifies a host. Set here as a global label so it
              # covers node_exporter, cAdvisor, Traefik and the textfile
              # collector at once. The central overwrites it from the
              # authenticated user, which is what makes it trustworthy.
              ic_account: "{{ ic_account }}"

          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]

          {% if ic_has_traefik %}
            # Scraped over Traefik's own docker network, by service name.
            # This is where per-instance HTTP rates/latencies come from,
            # with no agent inside the instances. Only emitted when
            # Traefik is actually on this host: a job pointing at nothing
            # would sit at up=0 forever and look like a real outage.
            - job_name: traefik
              static_configs:
                - targets: ["proxy:8082"]
              # Attribute each sample to the instance that answers under
              # that service. The names are derived, not guessed: the
              # panel feeds copier ``project_name = doodba_project_name``,
              # the same string it forces into COMPOSE_PROJECT_NAME, so
              # the prefix below is computed from panel state.
              #
              # Only the prefix is matched because the suffix varies by
              # role and environment (``-prod-main``,
              # ``-prod-longpolling``, ``-test-…``). Routers additionally
              # carry an ``https-`` prefix in the template's output,
              # hence the optional group.
              metric_relabel_configs:
          {% for inst in ic_instances %}
          {% if inst.traefik_prefix %}
                - source_labels: [service]
                  regex: "{{ inst.traefik_prefix }}.*"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [service]
                  regex: "{{ inst.traefik_prefix }}.*"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
                - source_labels: [service]
                  regex: "{{ inst.traefik_prefix }}.*"
                  target_label: project
                  replacement: "{{ inst.project }}"
                - source_labels: [router]
                  regex: "(https-)?{{ inst.traefik_prefix }}.*"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [router]
                  regex: "(https-)?{{ inst.traefik_prefix }}.*"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
          {% endif %}
          {% for extra in inst.traefik_extra | default([]) %}
                # An upper layer put its own router in front of this
                # instance, so traffic reports under that name instead.
                - source_labels: [service]
                  regex: "{{ extra }}"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [service]
                  regex: "{{ extra }}"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
          {% endfor %}
          {% endfor %}
          {% endif %}

            - job_name: cadvisor
              static_configs:
                - targets: ["cadvisor:8080"]
              metric_relabel_configs:
          {% for inst in ic_instances %}
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: instance_id
                  replacement: "{{ inst.instance_id }}"
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: instance
                  replacement: "{{ inst.instance }}"
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: project
                  replacement: "{{ inst.project }}"
          {% if inst.tenant %}
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: tenant
                  replacement: "{{ inst.tenant }}"
          {% endif %}
          {% if inst.tenant_id %}
                # The id, not just the slug: it survives a tenant rename,
                # so it is what per-tenant isolation can safely key on.
                - source_labels: [container_label_com_docker_compose_project]
                  regex: "{{ inst.compose_project }}"
                  target_label: tenant_id
                  replacement: "{{ inst.tenant_id }}"
          {% endif %}
          {% endfor %}
      register: ic_scrape_cfg

    - name: Write the access-log collector configuration
      # Only the proxy's own container is read, and only its JSON access
      # lines: Traefik's operational messages share the same stream and
      # are noise here. The service name becomes a label, which is what
      # makes "show me this instance's requests" a cheap query — its
      # cardinality is bounded by the instances on this host, not by
      # anything unbounded like a path or an IP.
      when: ic_logs_write_url | length > 0
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/promtail.yaml"
        mode: "0644"
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          positions:
            filename: /tmp/positions.yaml
          clients:
            - url: {{ ic_logs_write_url }}
              basic_auth:
                username: {{ ic_remote_write_user }}
                password_file: /etc/remote_write_token
          scrape_configs:
            - job_name: traefik-access
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 30s
                  filters:
                    - name: name
                      values: ["inverseproxy-proxy-1"]
              relabel_configs:
                - source_labels: ['__meta_docker_container_name']
                  target_label: container
                - target_label: host
                  replacement: "{{ ic_host_name }}"
              pipeline_stages:
                # Everything Traefik writes that is not an access line
                # starts with something other than a brace.
                - drop:
                    expression: '^[^{]'
                - json:
                    expressions:
                      service: ServiceName
                      status: DownstreamStatus
                - labels:
                    service:
      register: ic_promtail_cfg

    - name: Write the agents compose file
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/docker-compose.yaml"
        mode: "0644"
        content: |
          services:
            node-exporter:
              image: {{ ic_node_exporter_image }}
              restart: unless-stopped
              pid: host
              command:
                - '--path.rootfs=/host'
                - '--collector.textfile.directory=/textfile'
              volumes:
                - /:/host:ro,rslave
                - {{ ic_obs_dir }}/textfile:/textfile:ro

            cadvisor:
              image: {{ ic_cadvisor_image }}
              restart: unless-stopped
              privileged: true
              command:
                # cAdvisor does NOT expose container labels by default, so
                # without this the relabelling below matches nothing and
                # every container metric is unattributable — metrics arrive,
                # but no instance can ever be identified. Verified live: the
                # rules were correct and still produced zero series.
                #
                # Whitelist rather than --store_container_labels=true: the
                # latter turns every Docker label into a metric label, which
                # is the classic cAdvisor cardinality blow-up.
                - '--store_container_labels=false'
                - '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
                # Skip the host's own cgroups (/init.scope and friends).
                - '--docker_only=true'
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker/:/var/lib/docker:ro
                - /dev/disk/:/dev/disk:ro

          {% if ic_logs_write_url %}
            promtail:
              image: {{ ic_promtail_image }}
              restart: unless-stopped
              command: ['-config.file=/etc/promtail/promtail.yaml']
              volumes:
                - {{ ic_obs_dir }}/promtail.yaml:/etc/promtail/promtail.yaml:ro
                - {{ ic_obs_dir }}/.remote_write_token:/etc/remote_write_token:ro
                # Read-only socket: it only needs to discover and read the
                # proxy container's log stream.
                - /var/run/docker.sock:/var/run/docker.sock:ro
          {% endif %}

            vmagent:
              image: {{ ic_vmagent_image }}
              restart: unless-stopped
              # host-gateway is how the agent reaches a co-located central
              # (the remote-write URL); Traefik is reached over its own
              # network instead — see the networks block below.
              extra_hosts:
                - "host.docker.internal:host-gateway"
              networks:
                - default
          {% if ic_has_traefik %}
                - traefik
          {% endif %}
              command:
                - '-promscrape.config=/etc/scrape.yml'
                - '-remoteWrite.url={{ ic_remote_write_url }}'
                # Basic auth, not bearer: single-node VictoriaMetrics
                # only knows how to check -httpAuth.*, so a bearer token
                # was accepted-and-ignored by the central and authorised
                # nothing at all. Same secret, a scheme that is enforced.
                - '-remoteWrite.basicAuth.username={{ ic_remote_write_user }}'
                - '-remoteWrite.basicAuth.passwordFile=/etc/remote_write_token'
                # Survive a central outage instead of dropping samples.
                - '-remoteWrite.maxDiskUsagePerURL=512MB'
              volumes:
                - {{ ic_obs_dir }}/scrape.yml:/etc/scrape.yml:ro
                - {{ ic_obs_dir }}/.remote_write_token:/etc/remote_write_token:ro
                - vmagent-data:/vmagentdata
              depends_on:
                - node-exporter
                - cadvisor

          volumes:
            vmagent-data:

          networks:
            default:
          {% if ic_has_traefik %}
            traefik:
              external: true
              name: inverseproxy_shared
          {% endif %}
      register: ic_agents_compose

    - name: Install the per-instance disk usage collector
      # node_exporter's textfile collector turns a plain script into
      # metrics. Disk per instance is the one number cAdvisor cannot give
      # (it measures containers, not the deploy directory).
      #
      # ``inst.dir`` arrives as the panel stores it — ``~/<folder>/<name>``
      # unless the instance pins an absolute one. The tilde is expanded
      # HERE, while rendering, because bash never expands one that reaches
      # it as data: neither inside double quotes nor through a variable.
      # Left literal, the ``[ -d ]`` below is false for every instance, du
      # never runs, and the .prom file ends up holding nothing but its two
      # header lines — which reads as "no data", not as a bug. This is the
      # same expansion ``ic_expand_home`` does for the scripts that go
      # through run_script(); this template is the one generator that does
      # not, so it repeats it rather than sourcing lib/common.sh.
      ansible.builtin.copy:
        dest: "{{ ic_obs_dir }}/collect_disk.sh"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Auto-generated by IncubaCloud. Emits per-instance disk usage
          # for node_exporter's textfile collector. Written atomically:
          # node_exporter must never read a half-written file.
          set -euo pipefail
          out="{{ ic_obs_dir }}/textfile/ic_instance_disk.prom"
          tmp="${out}.$$"
          {
            echo "# HELP ic_instance_disk_bytes Disk used by an instance directory."
            echo "# TYPE ic_instance_disk_bytes gauge"
          {% for inst in ic_instances %}
          {% set inst_dir = inst.dir | regex_replace('^~/', ansible_env.HOME ~ '/') %}
            if [ -d "{{ inst_dir }}" ]; then
              size=$(du -sb "{{ inst_dir }}" 2>/dev/null | awk '{print $1}')
              [ -n "${size:-}" ] && printf 'ic_instance_disk_bytes{instance_id="%s",instance="%s"} %s\n' \
                '{{ inst.instance_id }}' '{{ inst.instance }}' "$size"
            fi
          {% endfor %}
          } > "$tmp"
          mv "$tmp" "$out"

    - name: Schedule the disk collector
      ansible.builtin.cron:
        name: "incubacloud instance disk usage"
        minute: "*/10"
        job: "{{ ic_obs_dir }}/collect_disk.sh >/dev/null 2>&1"

    - name: Bring the agents up
      # Retried on purpose. Compose pulls the three images concurrently,
      # and a freshly installed Docker occasionally fails one of them with
      # "lease does not exist: not found" — a containerd race, not a
      # configuration problem. Observed on a real first-boot host; the
      # pull succeeds on the next attempt.
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml up -d --remove-orphans
        chdir: "{{ ic_obs_dir }}"
      register: ic_agents_up
      retries: 3
      delay: 10
      until: ic_agents_up.rc == 0
      changed_when: true

    - name: Restart vmagent when its configuration changed
      # ``up -d`` does not restart a container whose image and compose
      # definition are unchanged, so a new scrape config alone would not
      # be picked up.
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml restart vmagent
        chdir: "{{ ic_obs_dir }}"
      when: ic_scrape_cfg is changed and ic_agents_compose is not changed
      changed_when: true

    - name: Wait for the agents to report healthy
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-observability -f docker-compose.yaml ps --format '{% raw %}{{.Service}} {{.State}}{% endraw %}'
        chdir: "{{ ic_obs_dir }}"
      register: ic_agents_ps
      changed_when: false

    - name: Export the agent facts
      ansible.builtin.set_stats:
        aggregate: false
        data:
          ic_agents_running: "{{ ic_agents_ps.stdout_lines | select('search', 'running') | list | length }}"
          ic_instances_labelled: "{{ ic_instances | length }}"

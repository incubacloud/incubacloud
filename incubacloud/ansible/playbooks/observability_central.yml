---
# Deploy the central metrics stack (VictoriaMetrics + Loki + Grafana,
# behind vmauth). Driven by ObservabilityCentralExecutor.
#
# Co-located on the panel host at first: VM + Grafana sit around 1-1.5 GB,
# which the panel box absorbs. The destination is a plain parameter, so
# moving the central to its own VPS later is "point the job at another
# host and re-run", not a rewrite.
#
# Grafana is provisioned as CODE (datasource + dashboards from files), not
# clicked: a hand-built dashboard is invisible to review and lost on the
# next redeploy.
#
# ── Why vmauth sits in front ───────────────────────────────────────────
# The central is shared: several panels (in SaaS, every tenant) write to
# and read from the same VictoriaMetrics. Single-node VM has no notion of
# accounts, so the boundary has to be imposed by something in front.
# vmauth is the auth proxy VictoriaMetrics ships for exactly this, and it
# beats a hand-written nginx on the one thing that matters here:
#
#   * on WRITE, the route forces ``extra_label=ic_account=<user>``; a
#     client that sends its own copy has it DROPPED for colliding, not
#     merged. An agent runs on a machine its owner has root on, so its
#     claim about who it is can never be trusted.
#   * on READ, the route forces ``extra_filters[]={ic_account="<user>"}``
#     the same way, so a client cannot widen the result by sending its
#     own filter.
#   * on LOGS, the account is the ``X-Scope-OrgID`` header, SET (not
#     appended) from the authenticated user.
#
# Measured (lab, 2026-08-10) against real VM + Loki: the forced arg wins,
# the client's is dropped, and a credential-less request is 401 — with no
# hand-written reject rules to rot when VM changes a query arg's meaning.
# The one thing vmauth cannot do is proxy websockets, which is why the
# Grafana BROWSER path does not go through it (the panel's Traefik carries
# that); everything vmauth serves is plain request/response.
#
# Grafana is no longer anonymous. It authenticates through the panel's
# identity provider when there is one (SaaS), or through a header set by
# the panel's own reverse proxy when there is not (self-hosted), and each
# account lands in its own organisation with a datasource it cannot
# change. Operators get a second, unfiltered credential that is never
# written to any host.
- name: Deploy the central metrics stack
  hosts: all
  gather_facts: true

  vars:
    ic_central_dir: "{{ ansible_env.HOME }}/observability-central"
    ic_retention_days: 90
    # The whole vmauth access-control document, rendered by the executor.
    ic_vmauth_config: ""
    # [{user, password}, ...] — the plaintext is needed to build each
    # organisation's datasource. Every task that touches it is no_log.
    ic_accounts: []
    ic_grafana_root_url: ""
    ic_grafana_oidc: {}
    ic_grafana_admin_password: ""
    ic_grafana_admin_basic: ""
    ic_vm_image: "victoriametrics/victoria-metrics:v1.102.0"
    ic_grafana_image: "grafana/grafana:11.2.0"
    # The account boundary. vmauth is VictoriaMetrics' own auth proxy;
    # pinned to the same release train as the backend.
    ic_vmauth_image: "victoriametrics/vmauth:v1.102.0"
    ic_loki_image: "grafana/loki:2.9.8"
    # Short by design: these lines carry end-user IP addresses.
    ic_log_retention_days: 14
    # Bound to the Docker bridge gateway, NOT to 127.0.0.1.
    #
    # Everything that consumes this stack is itself a container: the host
    # agents' vmagent pushes to it, and the panel queries it. Loopback on
    # the host is a different namespace from a container's loopback, so a
    # 127.0.0.1 bind is unreachable to every one of them — verified live,
    # where vmagent got "connection refused" against a healthy backend.
    #
    # Two things are published, both on the bridge: vmauth (the account
    # boundary for data) and Grafana (so the panel's Traefik can route
    # the browser to it — vmauth cannot proxy Grafana's websockets).
    # VictoriaMetrics and Loki have no host port at all: reachable only
    # over the compose network, so nothing can bypass vmauth by talking
    # to them directly. Grafana having a port is safe where theirs is
    # not — Grafana authenticates every request itself (OIDC); VM and
    # Loki authenticate nothing.
    ic_bridge_ip: "{{ ansible_docker0.ipv4.address | default('172.17.0.1') }}"
    ic_gateway_bind: "{{ ic_bridge_ip }}:8428"
    ic_grafana_bind: "{{ ic_bridge_ip }}:3000"

  tasks:
    # ── Where confidentiality is enforced ─────────────────────────────
    # On the DIRECTORY, not on the files inside it.
    #
    # The vmauth config and the datasource below are read by processes
    # inside the containers, and those processes are not root: vmauth runs
    # unprivileged and Grafana runs as uid 472. Writing them owner-only
    # looked like the careful choice and was the opposite — the first live
    # deployment (nginx, then) came up answering "permission denied" on
    # its own credential file, and a Grafana in a restart loop.
    #
    # So there is ONE gate, at the top: the root of the tree is not
    # traversable by anyone but its owner, and everything under it is
    # readable. A bind mount is resolved by the daemon, so a container
    # reads what is mounted into it without traversing the host path —
    # which is the asymmetry that makes this both work and stay closed.
    # The gate is ours rather than inherited on purpose: the parent is
    # the SSH user's home, and on a hardened host that is not 0700.
    - name: Create the central directory
      ansible.builtin.file:
        path: "{{ ic_central_dir }}"
        state: directory
        mode: "0700"

    # Traversable, because two of them are mounted into Grafana as
    # DIRECTORIES rather than file by file — at 0700 uid 472 could not
    # enter them, which is the same failure wearing a different hat.
    - name: Create the central subdirectories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        # Listed even though creating its children would create it: it is
        # a mount point, and its mode would otherwise be whatever the
        # umask happened to be.
        - "{{ ic_central_dir }}/provisioning"
        - "{{ ic_central_dir }}/provisioning/datasources"
        - "{{ ic_central_dir }}/provisioning/dashboards"
        - "{{ ic_central_dir }}/dashboards"
        - "{{ ic_central_dir }}/vmauth"

    - name: Write the vmauth access-control config
      # This file IS the boundary: one vmauth user per account (writes
      # and reads only its own series and logs, because the route forces
      # the ic_account label and the X-Scope-OrgID header from the
      # authenticated user) plus one operator (the cross-account read and
      # the Grafana admin API). Adding a user grants access; removing one
      # revokes it. There is no unauthorized_user section, which is what
      # makes a credential-less request 401 rather than proxied.
      #
      # Rendered whole by the executor rather than templated here: the
      # per-account url_map is easier to get right (and to test) in Python
      # than in Jinja, and it carries clear-text credentials that must not
      # be split across log lines.
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/vmauth/auth.yml"
        content: "{{ ic_vmauth_config }}"
        # Readable by vmauth's non-root process — confidentiality is on
        # the 0700 directory, see the directory task.
        mode: "0644"
      no_log: true
      register: ic_vmauth_cfg

    - name: Write the log store configuration
      # Retention is short and deliberate: these lines carry the IP
      # addresses of our tenants' end users, so we keep what an incident
      # needs and no more. ``auth_enabled`` is what makes the account
      # header meaningful — without it Loki ignores it and every account
      # shares one namespace.
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/loki.yaml"
        mode: "0644"
        content: |
          auth_enabled: true
          server:
            http_listen_port: 3100
          common:
            instance_addr: 127.0.0.1
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            allow_structured_metadata: false
            retention_period: {{ ic_log_retention_days }}d
          compactor:
            working_directory: /loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
      register: ic_loki_cfg

    - name: Provision the Grafana datasource
      # Points at vmauth's operator path, never at VictoriaMetrics
      # directly: the operator organisation is the one view that spans
      # accounts, and it still goes through the same front door.
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/provisioning/datasources/victoriametrics.yml"
        # Readable by Grafana, which runs as uid 472 — see the directory
        # task. Grafana refuses to start if it cannot read this, so
        # getting it wrong is loud rather than silent.
        mode: "0644"
        content: |
          # Auto-generated by IncubaCloud. Do not edit by hand.
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              access: proxy
              url: http://vmauth:8428/admin-r/
              isDefault: true
              basicAuth: true
              basicAuthUser: operator
              secureJsonData:
                basicAuthPassword: "{{ ic_operator_plain | default('') }}"
      no_log: true

    - name: Provision the dashboard loader
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/provisioning/dashboards/incubacloud.yml"
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: IncubaCloud
              folder: IncubaCloud
              type: file
              options:
                path: /var/lib/grafana/dashboards

    - name: Install the dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ic_central_dir }}/dashboards/{{ item | basename }}"
        mode: "0644"
      with_fileglob:
        - "../files/dashboards/*.json"

    - name: Write the central compose file
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/docker-compose.yaml"
        mode: "0644"
        content: |
          services:
            victoriametrics:
              image: {{ ic_vm_image }}
              restart: unless-stopped
              command:
                - '-retentionPeriod={{ ic_retention_days }}d'
                - '-storageDataPath=/vmdata'
                - '-httpListenAddr=:8428'
                # Bound to the compose network only — see the header.
              volumes:
                - vmdata:/vmdata

            loki:
              image: {{ ic_loki_image }}
              restart: unless-stopped
              command: ['-config.file=/etc/loki/local-config.yaml']
              volumes:
                - {{ ic_central_dir }}/loki.yaml:/etc/loki/local-config.yaml:ro
                - lokidata:/loki
              # No host port, same as VictoriaMetrics: the account
              # boundary is imposed by vmauth, and anything able to reach
              # Loki directly would bypass it.

            vmauth:
              image: {{ ic_vmauth_image }}
              restart: unless-stopped
              # Listen on 8428 (not vmauth's 8427 default) so every
              # service name in this stack — datasource, health check,
              # the agents' URLs — speaks one port.
              command:
                - '-auth.config=/etc/vmauth/auth.yml'
                - '-httpListenAddr=:8428'
              volumes:
                - {{ ic_central_dir }}/vmauth/auth.yml:/etc/vmauth/auth.yml:ro
              ports:
                - "{{ ic_gateway_bind }}:8428"
              depends_on:
                - victoriametrics
                - loki

            grafana:
              image: {{ ic_grafana_image }}
              restart: unless-stopped
              environment:
                # Anonymous access is OFF. It used to be on because the
                # panel proxy was the only way in; on a shared central
                # that would hand every account's data to anyone who
                # reached the URL.
                GF_AUTH_ANONYMOUS_ENABLED: "false"
                # Kept ON because Grafana cannot create an organisation
                # from file provisioning, so the panel drives the admin
                # API — through vmauth's operator-only path, which swaps
                # in this password. Grafana's bridge port is not routable
                # from off the host, and the password never travels to any
                # host, so the API is not a second public front door.
                GF_AUTH_BASIC_ENABLED: "true"
                GF_SECURITY_ADMIN_PASSWORD: "{{ ic_grafana_admin_password }}"
                GF_SECURITY_ALLOW_EMBEDDING: "true"
                # Grafana is reached by the browser THROUGH Traefik, not
                # through vmauth (which cannot proxy its websockets). This
                # bridge port is how the panel's Traefik routes to it; VM
                # and Loki have none.
                GF_USERS_DEFAULT_THEME: "dark"
                GF_USERS_ALLOW_SIGN_UP: "false"
          {% if ic_grafana_root_url %}
                GF_SERVER_ROOT_URL: "{{ ic_grafana_root_url }}"
                # Grafana is served under /grafana/, so it must build its
                # own links with that prefix or every asset 404s and the
                # embed shows a blank frame.
                GF_SERVER_SERVE_FROM_SUB_PATH: "true"
          {% endif %}
          {% if ic_grafana_oidc %}
                # Identity comes from the panel's own OIDC provider, and
                # the account claim maps each user into its organisation.
                # Grafana refuses datasources outside a user's org, which
                # is the second ring behind vmauth's own filter.
                GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
                GF_AUTH_GENERIC_OAUTH_NAME: "IncubaCloud"
                GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ ic_grafana_oidc.client_id }}"
                GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ ic_grafana_oidc.client_secret }}"
                GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
                GF_AUTH_GENERIC_OAUTH_AUTH_URL: "{{ ic_grafana_oidc.auth_url }}"
                GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ ic_grafana_oidc.token_url }}"
                GF_AUTH_GENERIC_OAUTH_API_URL: "{{ ic_grafana_oidc.userinfo_url }}"
                # The provider's oidc.client requires PKCE by default —
                # without this, Grafana's authorize request lacks a
                # code_challenge and the provider rejects it with 400.
                GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
                GF_AUTH_GENERIC_OAUTH_ORG_MAPPING: "{{ ic_grafana_oidc.org_mapping }}"
                # ``groups`` is the account-list claim the provider emits
                # (res.users._oidc_account_groups); org_mapping above maps
                # each entry to its own organisation. This MUST be
                # org_attribute_path, not groups_attribute_path — the
                # latter feeds Grafana's separate team-sync feature (which
                # we don't use) and org_mapping silently falls back to the
                # default org when it isn't set. Verified live: without
                # it, every login landed in Grafana's "Main Org." as
                # Viewer despite the id_token/userinfo carrying the
                # correct groups claim.
                GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH: "groups"
                GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
                GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
                # Grafana is embedded in an iframe inside the panel, where
                # an operator is already authenticated — without this,
                # Grafana shows its OWN login form first and makes them
                # click "Sign in with IncubaCloud" by hand every time.
                # With it, loading the iframe redirects straight into
                # /oauth/authorize; since their panel session is already
                # live, the whole exchange completes with no visible
                # login screen at all. Basic auth (used only for the
                # server-to-server admin API swap, never by a browser)
                # stays reachable via /grafana/login?disableAutoLogin=true.
                GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
          {% else %}
                # No identity provider (self-hosted). Grafana trusts a
                # header, and the ONLY thing allowed to set it is the
                # panel's own reverse proxy, which authenticates the
                # session first. Never expose Grafana directly when this
                # branch is active.
                GF_AUTH_PROXY_ENABLED: "true"
                GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
                GF_AUTH_PROXY_HEADER_PROPERTY: "username"
                GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
                GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
          {% endif %}
              ports:
                - "{{ ic_grafana_bind }}:3000"
              volumes:
                - grafana-data:/var/lib/grafana
                - {{ ic_central_dir }}/provisioning:/etc/grafana/provisioning:ro
                - {{ ic_central_dir }}/dashboards:/var/lib/grafana/dashboards:ro
              depends_on:
                - vmauth

          volumes:
            vmdata:
            lokidata:
            grafana-data:

    - name: Bring the central stack up
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-central -f docker-compose.yaml up -d --remove-orphans
        chdir: "{{ ic_central_dir }}"
      changed_when: true

    - name: Reload vmauth when only its configuration changed  # noqa: no-handler
      # ``up -d`` does not restart a container whose image and compose
      # definition are unchanged, so a new account list alone would not
      # be picked up — and an account that cannot authenticate looks
      # exactly like a broken agent. Not a handler on purpose: the reload
      # must land between ``up -d`` and the health check below, whereas
      # handlers run at the end of the play — after the probe.
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-central -f docker-compose.yaml restart vmauth
        chdir: "{{ ic_central_dir }}"
      when: ic_vmauth_cfg is changed
      changed_when: true

    - name: Wait for vmauth to answer
      # Through the front door, with the operator credential: this proves
      # the whole path works, not just that VictoriaMetrics is alive.
      # /admin-r/health -> vmauth drops /admin-r -> VM /health.
      ansible.builtin.uri:
        url: "http://{{ ic_gateway_bind }}/admin-r/health"
        status_code: [200]
        url_username: operator
        url_password: "{{ ic_operator_plain | default(omit, true) }}"
        force_basic_auth: true
      register: ic_vm_health
      retries: 10
      delay: 3
      until: ic_vm_health is succeeded
      no_log: true

    - name: Refuse to finish if anonymous writes are accepted
      # A regression here is silent and total: the boundary would be gone
      # while every dashboard kept working. Cheap to assert, so assert it.
      ansible.builtin.uri:
        url: "http://{{ ic_gateway_bind }}/w/"
        method: POST
        body: ""
        status_code: [401]
      register: ic_anon_write

    - name: Wait for Grafana to answer
      # The org provisioning below drives Grafana's admin API; it must be
      # up first. Its own port on the bridge, not through vmauth (which
      # does not carry the browser path).
      ansible.builtin.uri:
        url: "http://{{ ic_grafana_bind }}/api/health"
        status_code: [200]
      register: ic_grafana_health
      retries: 15
      delay: 3
      until: ic_grafana_health is succeeded

    - name: Force Grafana's admin password to match this deployment
      # GF_SECURITY_ADMIN_PASSWORD is applied only when Grafana first
      # initialises its database. The grafana-data volume persists across
      # redeploys, so a rotated password never reaches a Grafana that was
      # already initialised — and the admin API then rejects vmauth's
      # /gadmin/ credential swap with 401, which is exactly how the first
      # vmauth deploy failed (a volume left by an earlier attempt). Reset
      # it every run so the running Grafana, the compose file and the swap
      # always agree, whatever state the volume is in.
      #
      # Password on stdin, never as an argument: it is url-safe base64 and
      # can start with '-', which grafana-cli would read as a flag.
      ansible.builtin.command:
        cmd: >-
          docker exec -i incubacloud-central-grafana-1
          grafana-cli admin reset-admin-password --password-from-stdin
        stdin: "{{ ic_grafana_admin_password }}"
        stdin_add_newline: false
      no_log: true
      changed_when: true

    # ── Per-account Grafana organisations ─────────────────────────────
    # One organisation per account, each with a datasource that can only
    # reach that account's series. This is the ring behind vmauth's own
    # filter: Grafana refuses a datasource outside a user's org, so even
    # a bug in the query path cannot cross accounts.
    #
    # Done through the API because Grafana's file provisioning cannot
    # create organisations — and through vmauth's operator-only path, so
    # there is exactly one door rather than a second one to keep track of.
    - name: Ensure an organisation exists per account
      ansible.builtin.uri:
        url_username: operator
        url_password: "{{ ic_operator_plain }}"
        force_basic_auth: true
        url: "http://{{ ic_gateway_bind }}/gadmin/api/orgs"
        method: POST
        body_format: json
        body: { name: "{{ item.user }}" }
        # 409 = already there. Re-running this playbook is the normal way
        # to add a tenant, so "exists" is the common case, not an error.
        status_code: [200, 409]
      loop: "{{ ic_accounts }}"
      loop_control:
        label: "{{ item.user }}"
      register: ic_orgs
      no_log: true

    - name: Look up each organisation id
      ansible.builtin.uri:
        url_username: operator
        url_password: "{{ ic_operator_plain }}"
        force_basic_auth: true
        url: "http://{{ ic_gateway_bind }}/gadmin/api/orgs/name/{{ item.user }}"
        method: GET
        status_code: [200]
      loop: "{{ ic_accounts }}"
      loop_control:
        label: "{{ item.user }}"
      register: ic_org_ids
      no_log: true

    - name: Provision each organisation (switch, datasource, dashboards)
      # Switch, datasource and dashboards used to be three separate
      # tasks, each looping over every account on its own. Grafana's
      # "current org" is a persistent property of the authenticated
      # user, not a per-request header — so by the time the second
      # task's loop started, the switch task had already finished ITS
      # loop and left every write landing in whichever org was last
      # switched to. Measured in production: 9 accounts, only 2
      # datasources ever created, and one of those held the WRONG
      # account's credential. A block scopes switch+write to the same
      # loop iteration, so the org is never stale when we write to it.
      block:
        - name: Point the admin session at this organisation
          ansible.builtin.uri:
            url_username: operator
            url_password: "{{ ic_operator_plain }}"
            force_basic_auth: true
            url: "http://{{ ic_gateway_bind }}/gadmin/api/user/using/{{ item.1.json.id }}"
            method: POST
            status_code: [200]
          changed_when: false

        - name: Look up this organisation's datasource, if any
          ansible.builtin.uri:
            url_username: operator
            url_password: "{{ ic_operator_plain }}"
            force_basic_auth: true
            url: "http://{{ ic_gateway_bind }}/gadmin/api/datasources/name/VictoriaMetrics"
            method: GET
            status_code: [200, 404]
          register: ic_existing_ds

        - name: Create this organisation's scoped datasource
          # The credential here is the account's, so every query Grafana
          # makes on its behalf is filtered by vmauth to that account.
          # Nothing in the organisation can widen it: the users in it
          # are Viewers and cannot edit a datasource.
          ansible.builtin.uri:
            url_username: operator
            url_password: "{{ ic_operator_plain }}"
            force_basic_auth: true
            url: "http://{{ ic_gateway_bind }}/gadmin/api/datasources"
            method: POST
            body_format: json
            body: &ic_datasource_body
              name: "VictoriaMetrics"
              type: "prometheus"
              access: "proxy"
              url: "http://vmauth:8428/r/"
              isDefault: true
              basicAuth: true
              basicAuthUser: "{{ item.0.user }}"
              secureJsonData:
                basicAuthPassword: "{{ item.0.password }}"
            status_code: [200]
          when: ic_existing_ds.status == 404

        - name: Correct this organisation's scoped datasource if the credential drifted
          # A datasource named "VictoriaMetrics" already existing here
          # does not mean it holds THIS org's credential — POST alone
          # only 409s on a name collision, it can never fix one. This is
          # exactly how one org ended up authenticating as a different
          # account entirely (see the block comment above).
          ansible.builtin.uri:
            url_username: operator
            url_password: "{{ ic_operator_plain }}"
            force_basic_auth: true
            url: "http://{{ ic_gateway_bind }}/gadmin/api/datasources/uid/{{ ic_existing_ds.json.uid }}"
            method: PUT
            body_format: json
            body: *ic_datasource_body
            status_code: [200]
          when: ic_existing_ds.status == 200

        - name: Provision this organisation's dashboards
          # File-based provisioning (above) only ever lands in Grafana's
          # default org — every account here has its own org instead, so
          # from there those dashboards don't exist. Panels carry no
          # explicit datasource, so each copy binds to whichever one is
          # default in the org it lands in: the account-scoped one just
          # created above.
          ansible.builtin.uri:
            url_username: operator
            url_password: "{{ ic_operator_plain }}"
            force_basic_auth: true
            url: "http://{{ ic_gateway_bind }}/gadmin/api/dashboards/db"
            method: POST
            body_format: json
            body:
              dashboard: "{{ (lookup('file', dash_file) | from_json) | combine({'id': None}) }}"
              overwrite: true
            status_code: [200]
          loop: "{{ query('fileglob', '../files/dashboards/*.json') }}"
          loop_control:
            loop_var: dash_file
            label: "{{ dash_file | basename }}"
      no_log: true
      loop: "{{ ic_accounts | zip(ic_org_ids.results) | list }}"
      loop_control:
        label: "{{ item.0.user }}"

    - name: Export the central facts
      ansible.builtin.set_stats:
        aggregate: false
        data:
          ic_central_up: "{{ (ic_vm_health.status | default(0)) == 200 }}"
          ic_central_gateway: "http://{{ ic_gateway_bind }}"

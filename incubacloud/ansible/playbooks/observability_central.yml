---
# Deploy the central metrics stack (VictoriaMetrics + Grafana). Driven by
# ObservabilityCentralExecutor.
#
# Co-located on the panel host at first (P9-5): VM + Grafana sit around
# 1-1.5 GB, which the panel box absorbs. The destination is a plain
# parameter, so moving the central to its own VPS later is "point the job
# at another host and re-run", not a rewrite.
#
# Grafana is provisioned as CODE (datasource + dashboards from files), not
# clicked: a hand-built dashboard is invisible to review and lost on the
# next redeploy.
#
# Auth: Grafana runs anonymous BEHIND the panel's proxy, which is what
# gates access. A second login would duplicate the operator's session for
# no isolation gain — per-tenant isolation is the deferred tenant-facing
# view, and needs a different mechanism anyway.
- name: Deploy the central metrics stack
  hosts: all
  gather_facts: true

  vars:
    ic_central_dir: "{{ ansible_env.HOME }}/observability-central"
    ic_retention_days: 90
    ic_remote_write_token: ""
    ic_vm_image: "victoriametrics/victoria-metrics:v1.102.0"
    ic_grafana_image: "grafana/grafana:11.2.0"
    # Bound to the Docker bridge gateway, NOT to 127.0.0.1.
    #
    # Everything that consumes this stack is itself a container: the host
    # agents' vmagent pushes to it, and the panel queries it. Loopback on
    # the host is a different namespace from a container's loopback, so a
    # 127.0.0.1 bind is unreachable to every one of them — verified live,
    # where vmagent got "connection refused" against a healthy backend.
    #
    # The bridge gateway is reachable from containers on this host and is
    # not routable from outside it, so this keeps the endpoint private
    # without needing a firewall rule. Remote hosts reach the stack
    # through the panel's HTTPS proxy instead.
    ic_bridge_ip: "{{ ansible_docker0.ipv4.address | default('172.17.0.1') }}"
    ic_vm_bind: "{{ ic_bridge_ip }}:8428"
    ic_grafana_bind: "{{ ic_bridge_ip }}:3000"

  tasks:
    - name: Create the central directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ic_central_dir }}"
        - "{{ ic_central_dir }}/provisioning/datasources"
        - "{{ ic_central_dir }}/provisioning/dashboards"
        - "{{ ic_central_dir }}/dashboards"

    - name: Write the auth token for remote-write
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/.remote_write_token"
        content: "{{ ic_remote_write_token }}"
        mode: "0600"
      no_log: true

    - name: Provision the Grafana datasource
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/provisioning/datasources/victoriametrics.yml"
        mode: "0644"
        content: |
          # Auto-generated by IncubaCloud. Do not edit by hand.
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              access: proxy
              url: http://victoriametrics:8428
              isDefault: true
          {% if ic_remote_write_token %}
              basicAuth: true
              basicAuthUser: incubacloud
              secureJsonData:
                basicAuthPassword: "{{ ic_remote_write_token }}"
          {% endif %}

    - name: Provision the dashboard loader
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/provisioning/dashboards/incubacloud.yml"
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: IncubaCloud
              folder: IncubaCloud
              type: file
              options:
                path: /var/lib/grafana/dashboards

    - name: Install the dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ic_central_dir }}/dashboards/{{ item | basename }}"
        mode: "0644"
      with_fileglob:
        - "../files/dashboards/*.json"

    - name: Write the central compose file
      ansible.builtin.copy:
        dest: "{{ ic_central_dir }}/docker-compose.yaml"
        mode: "0644"
        content: |
          services:
            victoriametrics:
              image: {{ ic_vm_image }}
              restart: unless-stopped
              command:
                - '-retentionPeriod={{ ic_retention_days }}d'
                - '-storageDataPath=/vmdata'
                - '-httpListenAddr=:8428'
          {% if ic_remote_write_token %}
                # Actually enforce the shared secret. Single-node
                # VictoriaMetrics has no bearer-token check of its own,
                # so a token sent as `Authorization: Bearer` was written
                # to every host, transmitted on every push, and then
                # ignored — the endpoint accepted anonymous writes, and
                # anyone who could reach it could poison the series the
                # alert rules read. -httpAuth.* is the check it does
                # have; the agents present the same secret as basic auth.
                - '-httpAuth.username=incubacloud'
                - '-httpAuth.password={{ ic_remote_write_token }}'
          {% endif %}
              volumes:
                - vmdata:/vmdata
              ports:
                - "{{ ic_vm_bind }}:8428"

            grafana:
              image: {{ ic_grafana_image }}
              restart: unless-stopped
              environment:
                # Anonymous behind the panel proxy — see the header.
                GF_AUTH_ANONYMOUS_ENABLED: "true"
                GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
                GF_AUTH_BASIC_ENABLED: "false"
                # Required for the panel to embed the dashboards.
                GF_SECURITY_ALLOW_EMBEDDING: "true"
                GF_USERS_DEFAULT_THEME: "dark"
              volumes:
                - grafana-data:/var/lib/grafana
                - {{ ic_central_dir }}/provisioning:/etc/grafana/provisioning:ro
                - {{ ic_central_dir }}/dashboards:/var/lib/grafana/dashboards:ro
              ports:
                - "{{ ic_grafana_bind }}:3000"
              depends_on:
                - victoriametrics

          volumes:
            vmdata:
            grafana-data:

    - name: Bring the central stack up
      ansible.builtin.command:
        cmd: docker compose -p incubacloud-central -f docker-compose.yaml up -d --remove-orphans
        chdir: "{{ ic_central_dir }}"
      changed_when: true

    - name: Wait for VictoriaMetrics to answer
      ansible.builtin.uri:
        url: "http://{{ ic_vm_bind }}/health"
        status_code: [200]
        url_username: "{{ 'incubacloud' if ic_remote_write_token else omit }}"
        url_password: "{{ ic_remote_write_token | default(omit, true) }}"
        force_basic_auth: true
      register: ic_vm_health
      retries: 10
      delay: 3
      until: ic_vm_health is succeeded

    - name: Export the central facts
      ansible.builtin.set_stats:
        aggregate: false
        data:
          ic_central_up: "{{ ic_vm_health is succeeded }}"
          ic_retention_days: "{{ ic_retention_days }}"

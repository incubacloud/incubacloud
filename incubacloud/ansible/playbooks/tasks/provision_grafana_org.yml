---
# Included once per (account, org) pair from observability_central.yml,
# via ``loop:`` on the include itself. Switch, datasource and dashboards
# have to run in this order within ONE included instance — Grafana's
# "current org" is a persistent property of the authenticated admin,
# not a per-request header, so splitting them into independently
# looped tasks left every write landing in whichever org the last
# switch-loop iteration left active. Measured in production: 9
# accounts, 2 datasources ever created, one holding a different
# account's credential.
#
# ``item`` here is one ``ic_accounts | zip(ic_org_ids.results)`` pair:
# ``item.0`` is the account dict ({user, password}), ``item.1`` is the
# registered org lookup result for it.

- name: Point the admin session at this organisation
  ansible.builtin.uri:
    url_username: operator
    url_password: "{{ ic_operator_plain }}"
    force_basic_auth: true
    url: "http://{{ ic_gateway_bind }}/gadmin/api/user/using/{{ item.1.json.id }}"
    method: POST
    status_code: [200]
  changed_when: false

- name: Look up this organisation's datasource, if any
  ansible.builtin.uri:
    url_username: operator
    url_password: "{{ ic_operator_plain }}"
    force_basic_auth: true
    url: "http://{{ ic_gateway_bind }}/gadmin/api/datasources/name/VictoriaMetrics"
    method: GET
    status_code: [200, 404]
  register: ic_existing_ds

- name: Create this organisation's scoped datasource
  # The credential here is the account's, so every query Grafana makes
  # on its behalf is filtered by vmauth to that account. Nothing in the
  # organisation can widen it: the users in it are Viewers and cannot
  # edit a datasource.
  ansible.builtin.uri:
    url_username: operator
    url_password: "{{ ic_operator_plain }}"
    force_basic_auth: true
    url: "http://{{ ic_gateway_bind }}/gadmin/api/datasources"
    method: POST
    body_format: json
    body: &ic_datasource_body
      name: "VictoriaMetrics"
      type: "prometheus"
      access: "proxy"
      url: "http://vmauth:8428/r/"
      isDefault: true
      basicAuth: true
      basicAuthUser: "{{ item.0.user }}"
      secureJsonData:
        basicAuthPassword: "{{ item.0.password }}"
    status_code: [200]
  when: ic_existing_ds.status == 404

- name: Correct this organisation's scoped datasource if the credential drifted
  # A datasource named "VictoriaMetrics" already existing here does not
  # mean it holds THIS org's credential — POST alone only 409s on a
  # name collision, it can never fix one. This is exactly how one org
  # ended up authenticating as a different account entirely.
  ansible.builtin.uri:
    url_username: operator
    url_password: "{{ ic_operator_plain }}"
    force_basic_auth: true
    url: "http://{{ ic_gateway_bind }}/gadmin/api/datasources/uid/{{ ic_existing_ds.json.uid }}"
    method: PUT
    body_format: json
    body: *ic_datasource_body
    status_code: [200]
  when: ic_existing_ds.status == 200

- name: Provision this organisation's dashboards
  # File-based provisioning (in the parent playbook) only ever lands in
  # Grafana's default org — every account here has its own org instead,
  # so from there those dashboards don't exist. Panels carry no
  # explicit datasource, so each copy binds to whichever one is default
  # in the org it lands in: the account-scoped one just created above.
  ansible.builtin.uri:
    url_username: operator
    url_password: "{{ ic_operator_plain }}"
    force_basic_auth: true
    url: "http://{{ ic_gateway_bind }}/gadmin/api/dashboards/db"
    method: POST
    body_format: json
    body:
      dashboard: "{{ (lookup('file', dash_file) | from_json) | combine({'id': None}) }}"
      overwrite: true
    status_code: [200]
  loop: "{{ ic_dashboard_files }}"
  loop_control:
    loop_var: dash_file
    label: "{{ dash_file | basename }}"

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    restart: unless-stopped
    command:
      - '-retentionPeriod=90d'
      - '-storageDataPath=/vmdata'
      - '-httpListenAddr=:8428'
      # Bound to the compose network only — see the header.
    volumes:
      - vmdata:/vmdata

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - /root/observability-central/loki.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    # No host port, same as VictoriaMetrics: the account
    # boundary is imposed by vmauth, and anything able to reach
    # Loki directly would bypass it.

  vmauth:
    image: victoriametrics/vmauth:v1.102.0
    restart: unless-stopped
    # Listen on 8428 (not vmauth's 8427 default) so every
    # service name in this stack — datasource, health check,
    # the agents' URLs — speaks one port.
    command:
      - '-auth.config=/etc/vmauth/auth.yml'
      - '-httpListenAddr=:8428'
    volumes:
      - /root/observability-central/vmauth/auth.yml:/etc/vmauth/auth.yml:ro
    ports:
      - "172.17.0.1:8428:8428"
    # Published under its own name through this host's Traefik,
    # which reaches it over the shared network. The same routes
    # as the hand-written gateway of a central next to its panel
    # (incubacloud/data/observability-traefik-metrics-gateway.yml): the
    # account prefixes for everyone (vmauth asks each for its
    # credential), the deletion route for the panel only, the
    # rest of the operator routes for nobody off this host.
    networks:
      - default
      - inverseproxy_shared
    labels:
      traefik.enable: "true"
      traefik.docker.network: inverseproxy_shared
      traefik.http.services.ic-central-gateway.loadbalancer.server.port: "8428"
      traefik.http.routers.ic-central-data.rule: "Host(`metrics-central.example.test`) && (PathPrefix(`/w/`)
        || PathPrefix(`/r/`) || PathPrefix(`/lw/`) || PathPrefix(`/lr/`))"
      traefik.http.routers.ic-central-data.entrypoints: https
      traefik.http.routers.ic-central-data.service: ic-central-gateway
      traefik.http.routers.ic-central-data.priority: "10"
      traefik.http.routers.ic-central-delete.rule: "Host(`metrics-central.example.test`) && PathPrefix(`/admin-d/`)"
      traefik.http.routers.ic-central-delete.entrypoints: https
      traefik.http.routers.ic-central-delete.service: ic-central-gateway
      traefik.http.routers.ic-central-delete.priority: "30"
      traefik.http.routers.ic-central-delete.middlewares: ic-central-delete-sources
      traefik.http.middlewares.ic-central-delete-sources.ipwhitelist.sourcerange: "127.0.0.1/32,198.51.100.7/32"
      traefik.http.routers.ic-central-operator.rule: "Host(`metrics-central.example.test`) && (PathPrefix(`/admin-r/`) || PathPrefix(`/gadmin/`))"
      traefik.http.routers.ic-central-operator.entrypoints: https
      traefik.http.routers.ic-central-operator.service: ic-central-gateway
      traefik.http.routers.ic-central-operator.priority: "30"
      traefik.http.routers.ic-central-operator.middlewares: ic-central-host-only
      traefik.http.middlewares.ic-central-host-only.ipwhitelist.sourcerange: "127.0.0.1/32"
      traefik.http.routers.ic-central-data.tls.certresolver: letsencrypt
      traefik.http.routers.ic-central-delete.tls.certresolver: letsencrypt
      traefik.http.routers.ic-central-operator.tls.certresolver: letsencrypt
    depends_on:
      - victoriametrics
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      # Anonymous access is OFF. It used to be on because the
      # panel proxy was the only way in; on a shared central
      # that would hand every account's data to anyone who
      # reached the URL.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Kept ON because Grafana cannot create an organisation
      # from file provisioning, so the panel drives the admin
      # API — through vmauth's operator-only path, which swaps
      # in this password. Grafana's bridge port is not routable
      # from off the host, and the password never travels to any
      # host, so the API is not a second public front door.
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: "pw"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Grafana is reached by the browser THROUGH Traefik, not
      # through vmauth (which cannot proxy its websockets). This
      # bridge port is how the panel's Traefik routes to it; VM
      # and Loki have none.
      GF_USERS_DEFAULT_THEME: "dark"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No identity provider (self-hosted). Grafana trusts a
      # header, and the ONLY thing allowed to set it is the
      # panel's own reverse proxy, which authenticates the
      # session first. Never expose Grafana directly when this
      # branch is active.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
    ports:
      - "172.17.0.1:3000:3000"
    # The dashboards under /grafana/ of the public name. The
    # header Grafana trusts when there is no identity provider
    # is removed from every request that comes this way: only
    # the panel's own proxy may ever set it.
    networks:
      - default
      - inverseproxy_shared
    labels:
      traefik.enable: "true"
      traefik.docker.network: inverseproxy_shared
      traefik.http.services.ic-central-grafana.loadbalancer.server.port: "3000"
      traefik.http.routers.ic-central-grafana.rule: "Host(`metrics-central.example.test`) && PathPrefix(`/grafana/`)"
      traefik.http.routers.ic-central-grafana.entrypoints: https
      traefik.http.routers.ic-central-grafana.service: ic-central-grafana
      traefik.http.routers.ic-central-grafana.priority: "20"
      traefik.http.routers.ic-central-grafana.middlewares: ic-central-grafana-headers
      traefik.http.middlewares.ic-central-grafana-headers.headers.customrequestheaders.X-WEBAUTH-USER: ""
      traefik.http.middlewares.ic-central-grafana-headers.headers.contentsecuritypolicy: "frame-ancestors 'self' https://panel.example.test"
      traefik.http.routers.ic-central-grafana.tls.certresolver: letsencrypt
    volumes:
      - grafana-data:/var/lib/grafana
      - /root/observability-central/provisioning:/etc/grafana/provisioning:ro
      - /root/observability-central/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - vmauth

networks:
  inverseproxy_shared:
    external: true

volumes:
  vmdata:
  lokidata:
  grafana-data:
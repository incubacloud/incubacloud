global:
  sendAnonymousUsage: false

providers:
  docker:
    endpoint: "http://dockersocket:2375"
    watch: true
    exposedByDefault: false
    network: traefik_shared

  # The whole directory, not one file: the default certificate and the
  # CDN's client-certificate requirement are documents of their own,
  # dropped in and removed by the panel. Full Setup copies config.yml
  # in there too, since Traefik reads either one file or one directory.
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Uncomment for DEBUG logs
# log:
#   level: DEBUG

entryPoints:
  # Prometheus metrics, for the local vmagent. On the proxy's address on
  # its ``public`` network, which vmagent joins and no instance does: on
  # ":8082" every instance on ``shared`` could read the routers and
  # request counts of all the others. The loopback port inverseproxy.yaml
  # publishes reaches it too. The name has to resolve, or the proxy does
  # not start: keep the ``public`` network and the ``proxy`` service.
  metrics:
    address: "proxy.inverseproxy_public:8082"
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    http:
      tls: "true"
      # Default middleware for every router on this entrypoint. The
      # per-project routers are generated by copier and reference only
      # their own middlewares, so a header set here is the only one that
      # reaches every tenant, the catch-all and the metrics gateway
      # without editing a single generated compose file.
      middlewares:
        - hsts@file
        - ratelimit@file
    address: ":443"

api:
  dashboard: true

# Per-request record of who asked for what. The metrics above give rate,
# status and latency, which is enough to notice an instance is being
# hammered — but they carry neither the client IP nor the path, so they
# cannot tell you what is being done or let you block it. That only
# exists here.
#
# Each line already carries ``RouterName`` and ``ServiceName`` in full
# (``<project>-<version>-prod-main@docker``), which is the SAME key the
# metric relabelling joins on. So attributing a log line to its instance
# needs no domain lookup and survives custom domains, redirects and
# multi-domain instances.
#
# Headers are dropped: keeping them would put cookies and Authorization
# on disk on every host, and the point of this file is diagnosing
# traffic, not archiving credentials.
# Written to its own file on the host, rotated daily and kept 30 days by
# the logrotate entry Full Setup installs (it signals the proxy to reopen
# the file). It used to go to stdout, where Docker's rotation kept 30 MB
# in all -- hours of history on a busy host -- and its path changed with
# every recreate of the container, so nothing could watch it. The panel's
# "Recent requests", the log collector and the host's web-login jail all
# read this file.
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

# HTTP metrics per router/service — this is what gives per-instance
# request rates, status codes and latencies without installing anything
# inside the instances themselves.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "mail@mycustomdomain.com"
      storage: "/etc/traefik/acme/acme.json"
      # CA server to use.
      # UnComment the line to use Let's Encrypt's staging server
      #caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      tlsChallenge: {}

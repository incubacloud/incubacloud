global:
  sendAnonymousUsage: false

providers:
  docker:
    endpoint: "http://dockersocket:2375"
    watch: true
    exposedByDefault: false
    network: traefik_shared

  file:
    filename: /etc/traefik/config.yml
    watch: true

# Uncomment for DEBUG logs
# log:
#   level: DEBUG

entryPoints:
  # Prometheus metrics, published on loopback only (see inverseproxy.yaml)
  # so the local vmagent can scrape it and nothing else can.
  metrics:
    address: ":8082"
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    http:
      tls: "true"
    address: ":443"

api:
  dashboard: true

# HTTP metrics per router/service — this is what gives per-instance
# request rates, status codes and latencies without installing anything
# inside the instances themselves.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "mail@mycustomdomain.com"
      storage: "/etc/traefik/acme/acme.json"
      # CA server to use.
      # UnComment the line to use Let's Encrypt's staging server
      #caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      tlsChallenge: {}

global:
  sendAnonymousUsage: false

providers:
  docker:
    endpoint: "http://dockersocket:2375"
    watch: true
    exposedByDefault: false
    network: traefik_shared

  file:
    filename: /etc/traefik/config.yml
    watch: true

# Uncomment for DEBUG logs
# log:
#   level: DEBUG

entryPoints:
  # Prometheus metrics, published on loopback only (see inverseproxy.yaml)
  # so the local vmagent can scrape it and nothing else can.
  metrics:
    address: ":8082"
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    http:
      tls: "true"
      # Default middleware for every router on this entrypoint. The
      # per-project routers are generated by copier and reference only
      # their own middlewares, so a header set here is the only one that
      # reaches every tenant, the catch-all and the metrics gateway
      # without editing a single generated compose file.
      middlewares:
        - hsts@file
    address: ":443"

api:
  dashboard: true

# Per-request record of who asked for what. The metrics above give rate,
# status and latency, which is enough to notice an instance is being
# hammered — but they carry neither the client IP nor the path, so they
# cannot tell you what is being done or let you block it. That only
# exists here.
#
# Each line already carries ``RouterName`` and ``ServiceName`` in full
# (``<project>-<version>-prod-main@docker``), which is the SAME key the
# metric relabelling joins on. So attributing a log line to its instance
# needs no domain lookup and survives custom domains, redirects and
# multi-domain instances.
#
# Headers are dropped: keeping them would put cookies and Authorization
# on disk on every host, and the point of this file is diagnosing
# traffic, not archiving credentials.
# Written to stdout on purpose, not to a file. A file would need
# rotation, and an unrotated access log on a busy instance fills the
# disk — the failure nobody notices until the host stops. Docker's
# json-file driver already rotates every container's output at 10 MB
# (set fleet-wide by the hardening playbook), so stdout inherits a
# rotation policy that exists and is enforced.
accessLog:
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

# HTTP metrics per router/service — this is what gives per-instance
# request rates, status codes and latencies without installing anything
# inside the instances themselves.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "mail@mycustomdomain.com"
      storage: "/etc/traefik/acme/acme.json"
      # CA server to use.
      # UnComment the line to use Let's Encrypt's staging server
      #caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      tlsChallenge: {}

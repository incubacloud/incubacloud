http:
  middlewares:
    buffering:
      buffering:
        retryExpression: IsNetworkError() && Attempts() < 5
    compress:
      compress: "true"
    secure:
      headers:
        forceSTSHeader: "true"
        sslRedirect: "true"
        # HSTS: 1 year, all subdomains, eligible for the browser preload list.
        stsSeconds: 31536000
        stsIncludeSubdomains: "true"
        stsPreload: "true"
        # X-Frame-Options: DENY — block embedding in iframes (clickjacking).
        frameDeny: "true"
        # X-Content-Type-Options: nosniff — block MIME sniffing.
        contentTypeNosniff: "true"
        # X-XSS-Protection: 1; mode=block — legacy header, still respected
        # by older browsers.
        browserXssFilter: "true"
        # Don't leak full URLs to cross-origin destinations.
        referrerPolicy: "strict-origin-when-cross-origin"
    nocrawlers:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
    doodba:
      chain:
        middlewares:
          - buffering
          - compress
          - secure
    localhost-only:
      ipWhitelist:
        sourceRange:
          - "127.0.0.1/32"
          - "10.11.0.0/16" # change to your docker subnet
    prod-headers:
      headers:
        customResponseHeaders:
          # In environment with versioned static files, switch commented
          # Cache-Control: "private,max-age=31536000"
          Cache-Control: "private,no-cache"
    test-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "private,no-cache"

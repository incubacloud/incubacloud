http:
  middlewares:
    # Per-source-IP rate limit, added as the https entrypoint default
    # so it reaches every copier-generated tenant router without editing
    # a single generated compose file — the same mechanism as `hsts`.
    # Throttles by client IP before a request can reach Odoo's pbkdf2
    # login, so a flood from one source cannot burn the host CPU.
    #
    # Direct traffic only: sourceCriterion defaults to the real remote
    # IP, correct when tenant domains resolve straight to the host. A
    # host placed behind a trusted CDN/proxy must set
    # sourceCriterion.ipStrategy so the limit keys on the real client
    # and not on a handful of edge IPs. Values are generous on purpose
    # and tunable live: this file is watched, Traefik reloads it with no
    # image rebuild.
    ratelimit:
      rateLimit:
        average: 300
        period: 1m
        burst: 100
    buffering:
      buffering:
        retryExpression: IsNetworkError() && Attempts() < 5
    compress:
      compress: "true"
    secure:
      headers:
        forceSTSHeader: "true"
        sslRedirect: "true"
        # HSTS: 1 year, all subdomains, eligible for the browser preload list.
        stsSeconds: 31536000
        stsIncludeSubdomains: "true"
        stsPreload: "true"
        # X-Frame-Options: DENY — block embedding in iframes (clickjacking).
        frameDeny: "true"
        # X-Content-Type-Options: nosniff — block MIME sniffing.
        contentTypeNosniff: "true"
        # X-XSS-Protection: 1; mode=block — legacy header, still respected
        # by older browsers.
        browserXssFilter: "true"
        # Don't leak full URLs to cross-origin destinations.
        referrerPolicy: "strict-origin-when-cross-origin"
    # HSTS on its own, so it can be the default middleware of the https
    # entrypoint without dragging the rest of `secure` along. `secure`
    # sets frameDeny (X-Frame-Options: DENY), which would blank out the
    # panel's Grafana iframes and break Odoo's own website editor, and it
    # sets stsIncludeSubdomains/stsPreload, which must not be turned on
    # until every subdomain is known to hold a valid certificate: with
    # includeSubDomains, an expired tenant cert becomes unreachable with
    # no click-through.
    #
    # forceSTSHeader alone emits nothing — Traefik only writes the header
    # when stsSeconds is non-zero. That is the bug this middleware fixes.
    hsts:
      headers:
        forceSTSHeader: "true"
        stsSeconds: 31536000
    nocrawlers:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
    doodba:
      chain:
        middlewares:
          - buffering
          - compress
          - secure
    localhost-only:
      ipWhitelist:
        sourceRange:
          - "127.0.0.1/32"
          - "10.11.0.0/16" # change to your docker subnet
    prod-headers:
      headers:
        customResponseHeaders:
          # In environment with versioned static files, switch commented
          # Cache-Control: "private,max-age=31536000"
          Cache-Control: "private,no-cache"
    test-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "private,no-cache"

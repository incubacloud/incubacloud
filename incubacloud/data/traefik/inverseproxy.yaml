version: "3.8"

services:
  proxy:
    image: traefik:v2.11
    networks:
      shared:
      private:
      public:
    ports:
      - "80:80"
      - "443:443"
      # Prometheus metrics: loopback only. The local vmagent scrapes it
      # through the host gateway; nothing off-box can reach it.
      - "127.0.0.1:8082:8082"
    depends_on:
      - dockersocket
    restart: unless-stopped
    tty: true
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config.yml:/etc/traefik/config.yml:ro
      - ./certs:/etc/certs:rw,Z
      - acme:/etc/traefik/acme:rw,Z
    #
    # Note: when used in docker-compose.yml all dollar signs in the hash need to be doubled for escaping.
    # To create user:password pair, it's possible to use this command:
    # echo $(htpasswd -nB traefik-admin) | sed -e s/\\$/\\$\\$/g
    #
    # Also note that dollar signs should NOT be doubled when they not evaluated (e.g. Ansible docker_container module).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared"
      - "traefik.http.routers.api.rule=Host(`traefik.mycustomdomain.com`)"
      # Deny-by-default placeholder. `full_setup_executor._build_inverseproxy`
      # rewrites this line at provision time using bcrypt cost=12 against
      # the host's `traefik_panel_password`. If the substitution is ever
      # skipped (empty `panel_password`), this malformed bcrypt string
      # matches no password → 401 guaranteed instead of leaving a
      # crackable real hash committed in the repo.
      - "traefik.http.middlewares.auth.basicauth.users=traefik-admin:$$2y$$12$$panel-disabled-set-traefik-panel-password-on-host"
      - "traefik.http.routers.api.tls.certResolver=letsencrypt"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.middlewares=auth"

  dockersocket:
    image: tecnativa/docker-socket-proxy
    networks:
      private:
    volumes:
      # :ro — the proxy only exposes read-only endpoints
      # (CONTAINERS/NETWORKS/SERVICES) for Traefik discovery, never
      # writes back to the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      # Standalone Docker (provider: docker, not swarm) — keep Swarm
      # endpoints disabled to shrink the daemon API surface.
      SWARM: 0
      TASKS: 0
    restart: unless-stopped

networks:
  shared:
    internal: true
    driver_opts:
      encrypted: 1

  private:
    internal: true
    driver_opts:
      encrypted: 1

  public:

volumes:
  acme:

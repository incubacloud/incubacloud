; IncubaCloud: renews the relay's OAuth2 access token (client credentials)
; into the token file sasl-xoauth2 reads on every authentication.
; startsecs=0: a missing credentials file is waited for inside the program
; (status config_missing), not by restarting it.
[program:ic-relay-oauth]
command=/usr/local/bin/ic-relay-oauth run
user=root
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=5
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stderr_logfile=/var/log/supervisor/%(program_name)s.log

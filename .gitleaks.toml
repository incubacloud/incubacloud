# gitleaks config — tuned to match this repo's layout.
#
# Extends the upstream default ruleset and adds narrow allowlists for
# intentional matches:
#   - Test fixtures that embed sample RSA keys.
#   - Translation files and UI placeholders that carry the
#     "BEGIN PRIVATE KEY" marker as part of instructional copy.
#   - One historical commit where a short-lived dev fallback key lived
#     in password_utils.py before the mandatory-env-var rollout.
#
# When adding a new allowlist entry, prefer ``paths`` (narrow, stable)
# over ``commits`` (rewrites break the allowlist).
#
# NOTE: gitleaks 8.x expects a single ``[allowlist]`` table here —
# ``[[allowlists]]`` (plural) is silently ignored by the global
# allowlist loader, which is why the first version of this file let
# all five false positives through.

[extend]
useDefault = true

[allowlist]
description = "Known-safe false positives: test fixtures, translations, UI placeholders, and one historical dev-only fallback key."
paths = [
    # Tier-2 test: uses the string ``fakekey...`` as a PEM body to
    # exercise the GitHub App credential parser. No real key.
    '''incubacloud/tests/test_cloud_github_app\.py''',
    # Translations quote help text and error messages that include the
    # literal ``-----BEGIN PRIVATE KEY-----`` marker.
    '''incubacloud/i18n/.*\.po''',
    '''incubacloud/i18n/.*\.pot''',
    # Settings form textarea ``placeholder=""`` attribute showing the
    # expected PEM shape.
    '''incubacloud/static/src/components/settings/settings\.xml''',
    # CI workflow pins a CI-only Fernet key so the password_utils
    # module can boot in the test container. Not a production secret.
    '''\.github/workflows/ci\.yml''',
]
commits = [
    # password_utils.py historically contained a base64 dev fallback
    # key (``development-key-do-not-use``). It was removed before
    # production; the commit stays in history, flagged by gitleaks as
    # ``generic-api-key`` on the string literal.
    "4ba501eb2979745559c511142f1a307594a4f9f6",
]

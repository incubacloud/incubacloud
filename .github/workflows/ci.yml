name: CI

on:
  push:
    branches: ["19.0"]
  pull_request:
    branches: ["19.0"]

# CN-010: Deny all permissions by default; grant read-only per job.
# This prevents a compromised step from using GITHUB_TOKEN to push code.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint (refurb)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # CN-009: Pinned to commit SHA to prevent mutable-tag supply-chain attacks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install refurb
        run: pip install refurb

      - name: Run refurb
        # Exclude ``migrations/`` — refurb uses mypy internally and two
        # ``post-migrate.py`` files in sibling version dirs trigger a
        # "Duplicate module named" error. Migration scripts are tiny
        # and tested by the boot-install path, so skipping them from
        # the style linter is safe.
        run: |
          find incubacloud incubacloud_connect \
            -name '*.py' -not -path '*/migrations/*' -print0 \
            | xargs -0 --no-run-if-empty refurb

  test:
    name: Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # CN-011: Pinned to digest to prevent silent image changes.
    # Update intentionally: docker pull ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
    #   then: docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
    container: ghcr.io/oca/oca-ci/py3.10-odoo19.0@sha256:9147149654ace4f05a16a4b76772a9f5e4021932291fdffcc8918a13ae80446c

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: postgres
      PGUSER: odoo
      PGPASSWORD: odoo
      PGDATABASE: test_odoo
      ADDONS_DIR: .

    steps:
      # CN-009: Pinned to commit SHA to prevent mutable-tag supply-chain attacks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install extra dependencies
        # CN-012/CN-020/CN-026: Exact pins match requirements.txt — reproducible CI.
        # ``asyncssh`` pulls in ``cryptography>=39``; pip resolves the latest
        # (46.x). Cryptography 45+ removed the ``X509_V_FLAG_NOTIFY_POLICY``
        # FFI symbol, which the OCA image's bundled pyOpenSSL (24.x) still
        # references at import time → ``ir_mail_server`` fails to import.
        # Upgrading ``pyopenssl`` to 25.3+ drops that reference and restores
        # compatibility with cryptography 46.
        run: pip install 'asyncssh==2.22.0' 'boto3==1.42.89' 'freezegun==1.5.5' 'PyYAML==6.0.3' 'bcrypt==5.0.0' 'pyopenssl>=25.3.0'

      - name: Fetch OCA dependencies
        run: |
          git clone --depth 1 --branch 19.0 https://github.com/OCA/queue.git /opt/odoo/addons-oca/queue
          ln -s /opt/odoo/addons-oca/queue/queue_job /opt/odoo/addons/queue_job

      - name: Install addons
        run: oca_install_addons

      - name: Initialize test database
        run: oca_init_test_database

      - name: Run tests
        run: oca_run_tests

  bandit:
    name: Security (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # CN-009: Pinned to commit SHA to prevent mutable-tag supply-chain attacks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install 'bandit==1.8.6'

      # ``-ll -iii`` = medium+ severity, high confidence. Drops the
      # long tail of low-severity guesses (``assert`` in tests,
      # ``random`` used for non-crypto, etc.) that bandit flags by
      # default and that have no security impact in this codebase.
      - name: Run bandit
        run: bandit -r incubacloud/ incubacloud_connect/ -ll -iii

  pip-audit:
    name: Deps audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install 'pip-audit==2.9.0'

      # ``--strict`` makes pip-audit fail on ANY finding; the CI
      # becomes the gate. ``requirements-ci.txt`` mirrors pip.txt
      # (minus the openupgradelib git URL, which pip-audit cannot
      # resolve against PyPI).
      - name: Run pip-audit
        run: pip-audit --strict -r requirements-ci.txt

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # gitleaks scans history, not just the working tree, so we
          # need the full commit graph. The shallow default (depth=1)
          # would hide any secret committed in the past and only
          # detect re-introductions.
          fetch-depth: 0

      # CN-009: Using the upstream CLI release instead of the v2 Action,
      # which requires a paid license key for organization-owned repos
      # (https://github.com/gitleaks/gitleaks-action#-announcement).
      # The CLI itself stays MIT-licensed. Pinned to a known-good tag.
      - name: Install gitleaks
        run: |
          curl -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        # ``detect`` scans the working tree + the whole history available
        # under .git; ``--redact`` keeps the logs safe even if a finding
        # lands in the annotations UI.
        run: gitleaks detect --source . --redact --verbose

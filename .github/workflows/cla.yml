name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/incubacloud/incubacloud/blob/19.0/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'rquevedo,dependabot[bot],dependabot-preview[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge it, we need you
            to sign our [Contributor License Agreement](https://github.com/incubacloud/incubacloud/blob/19.0/CLA.md).
            You can sign by posting the comment below. You only need to do this once.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'

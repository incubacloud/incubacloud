name: Docs

on:
  push:
    branches: ["19.0"]
    paths:
      - "docs/user/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["19.0"]
    paths:
      - "docs/user/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# CN-010: Deny all permissions by default; grant per-job.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # CN-009: Pinned to commit SHA to prevent mutable-tag supply-chain attacks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/user/requirements.txt

      - name: Install mkdocs and theme
        run: pip install -r docs/user/requirements.txt

      - name: Build site
        working-directory: docs/user
        run: mkdocs build --strict

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: site
          path: docs/user/site/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/19.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/user/requirements.txt

      - name: Install mkdocs and theme
        run: pip install -r docs/user/requirements.txt

      - name: Build site
        working-directory: docs/user
        run: mkdocs build --strict

      # CN-009: Pinned to commit SHA.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/user/site
          publish_branch: gh-pages
          cname: docs.incubacloud.io

name: relay-oauth image

# The SMTP relay image for instances whose relay signs in to Microsoft 365
# with OAuth2 (images/relay-oauth/README.md). Every run builds it natively
# on amd64 and arm64 and tests it there: the plugin's ctest inside the
# build, the renewer's pytest, and the container against a fake token
# endpoint and SMTP server. Only a tag relay-oauth-v<image tag> publishes,
# signed and with its provenance, to ghcr.io/incubacloud/relay-oauth: the
# image that was tested is the one pushed, never a rebuild. How to cut a
# release: docs/runbooks/RB-31-bump-relay-oauth-image.md.

on:
  pull_request:
    branches: ["19.0"]
    paths:
      - "images/relay-oauth/**"
      - ".github/workflows/relay-oauth-image.yml"
  push:
    branches: ["19.0"]
    paths:
      - "images/relay-oauth/**"
      - ".github/workflows/relay-oauth-image.yml"
    # Path filters are not applied to tag pushes: a tag always runs.
    tags: ["relay-oauth-v*"]
  workflow_dispatch:

# CN-010: Deny all permissions by default; grant per job. Only the publish
# job, which runs on a tag alone, can write packages or ask for an OIDC token.
permissions: {}

concurrency:
  group: relay-oauth-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/incubacloud/relay-oauth

jobs:
  prepare:
    name: Versions and base digests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      dms_digest: ${{ steps.meta.outputs.dms_digest }}
      build_base: ${{ steps.meta.outputs.build_base }}
    steps:
      # CN-009: Pinned to commit SHA to prevent mutable-tag supply-chain attacks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # A tag is checked against the history of 19.0 below.
          fetch-depth: 0

      - name: Read the Dockerfile, resolve the base digests, check the tag
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          arg() { sed -n "s/^ARG $1=//p" images/relay-oauth/Dockerfile; }
          dms_image=$(arg DMS_IMAGE)
          dms_version=$(arg DMS_VERSION)
          build_base=$(arg BUILD_BASE)
          sx_tag=$(arg SX_TAG)
          base_tag="${dms_version}-${sx_tag#release-}"
          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest
          }
          # Once per run: both platforms build on the same base, even if
          # upstream rebuilds the tag meanwhile.
          dms_digest=$(digest "${dms_image}:${dms_version}")
          build_digest=$(digest "${build_base}")
          publish=false
          version="${base_tag}-dev"
          if [[ "$REF" == refs/tags/relay-oauth-v* ]]; then
            # Only what is on 19.0 is published: a tag on another branch or
            # on a commit that never got there would sign it as ours.
            if ! git merge-base --is-ancestor "$SHA" origin/19.0; then
              echo "::error::Tag $REF_NAME points to ${SHA}, which is not on 19.0"
              exit 1
            fi
            revision="${REF_NAME#"relay-oauth-v${base_tag}-"}"
            if [[ "$revision" == "$REF_NAME" || ! "$revision" =~ ^[0-9]+$ ]]; then
              echo "::error::Tag $REF_NAME does not match the Dockerfile: expected relay-oauth-v${base_tag}-<revision>"
              exit 1
            fi
            version="${base_tag}-${revision}"
            publish=true
          fi
          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "dms_digest=${dms_digest}"
            echo "build_base=${build_base}@${build_digest}"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### relay-oauth ${version}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| docker-mailserver | \`${dms_image}:${dms_version}@${dms_digest}\` |"
            echo "| build stage | \`${build_base}@${build_digest}\` |"
            echo "| sasl-xoauth2 | \`${sx_tag}\` \`$(arg SX_COMMIT)\` |"
            echo "| publish | ${publish} |"
          } >>"$GITHUB_STEP_SUMMARY"

  unit:
    name: Renewer tests (pytest) and shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          # The Python docker-mailserver 16.0.1 runs (Debian 13).
          python-version: "3.13"

      - name: Install pytest (pinned, with hashes)
        run: python -m pip install --require-hashes -r images/relay-oauth/tests/requirements.txt

      - name: pytest
        run: python -m pytest -p no:cacheprovider images/relay-oauth/tests

      - name: shellcheck
        run: shellcheck -x images/relay-oauth/tests/integration.sh

  build:
    name: Build and test (${{ matrix.arch }})
    needs: [prepare, unit]
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Build (the plugin's ctest runs inside)
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DMS_DIGEST: ${{ needs.prepare.outputs.dms_digest }}
          BUILD_BASE: ${{ needs.prepare.outputs.build_base }}
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker buildx build --platform "linux/${ARCH}" --load \
            --provenance=false --sbom=false \
            --build-arg DMS_DIGEST="${DMS_DIGEST}" \
            --build-arg BUILD_BASE="${BUILD_BASE}" \
            --build-arg IMAGE_VERSION="${VERSION}" \
            --build-arg VCS_REF="${VCS_REF}" \
            -t relay-oauth:test images/relay-oauth
          size=$(docker image inspect relay-oauth:test --format '{{.Size}}')
          echo "${ARCH}: built in $(( $(date +%s) - start )) s, ${size} bytes" >>"$GITHUB_STEP_SUMMARY"

      - name: Integration test (fake token endpoint and SMTP)
        run: images/relay-oauth/tests/integration.sh relay-oauth:test

      - name: Keep the tested image for publishing
        if: needs.prepare.outputs.publish == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save relay-oauth:test -o "${RUNNER_TEMP}/relay-oauth-${ARCH}.tar"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: relay-oauth-${{ matrix.arch }}
          path: ${{ runner.temp }}/relay-oauth-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish, sign and attest
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Where the owner may require a review before anything is pushed
    # (RB-31); GitHub creates it without rules on first use.
    environment: relay-oauth-publish
    permissions:
      contents: read
      packages: write  # push to ghcr.io/incubacloud/relay-oauth
      id-token: write  # OIDC identity for cosign keyless and the provenance
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: relay-oauth-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push the tested images and the multi-arch index
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # A published tag is never moved: a new build is a new revision.
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists; tag a new revision instead"
            exit 1
          fi
          refs=()
          for arch in amd64 arm64; do
            docker load -i "${RUNNER_TEMP}/images/relay-oauth-${arch}.tar"
            docker tag relay-oauth:test "${IMAGE}:${VERSION}-${arch}"
            docker push "${IMAGE}:${VERSION}-${arch}"
            # Docker's containerd image store pushes an index around the
            # platform's manifest: the index is made of the manifests only.
            d=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${arch}" --format '{{json .Manifest}}' \
              | jq -r --arg a "$arch" \
                  '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a) | .digest][0] // .digest')
            refs+=("${IMAGE}@${d}")
            docker rmi relay-oauth:test >/dev/null
          done
          # The base digest travels in each platform's labels
          # (org.opencontainers.image.base.digest), which the weekly
          # relay-oauth-versions workflow reads back.
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign (cosign keyless, the workflow's OIDC identity)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo ""
            echo "\`${IMAGE}:${VERSION}@${DIGEST}\`"
            echo ""
            echo "For core (RB-31): \`RELAY_OAUTH_IMAGE = \"${IMAGE}:${VERSION}@${DIGEST}\"\`"
          } >>"$GITHUB_STEP_SUMMARY"
